function updateComposer() {
  // While this chat's answer is coming, the button stops it.
  const stoppable = !!busy && busy.chatId === activeId && !!busy.stop;
  sendBtn.classList.toggle('stop', stoppable);
  sendBtn.setAttribute('aria-label', stoppable ? 'Stop' : 'Send');
  sendBtn.title = stoppable ? 'Stop this answer' : '';
  const icon = stoppable ? STOP_ICON : SEND_ICON;
  if (sendBtn.dataset.icon !== icon) { sendBtn.innerHTML = icon; sendBtn.dataset.icon = icon; }
  sendBtn.disabled = stoppable ? false : (!qBox.value.trim() || !!busy);
  // One answer at a time; if it is streaming in another chat, say so rather than
  // leaving the box mysteriously disabled.
  const cur = activeChat();
  const readonly = !!(cur && (cur.view || (cur.readonly && !cur.write)));
  const theirs = !!(cur && cur.busy && cur.busy.user !== ME);
  qBox.disabled = readonly || theirs;
  if (readonly || theirs) sendBtn.disabled = true;
  qBox.placeholder = readonly ? 'Shared with you, read-only. Clone it to continue on your own, or start a new chat.'
    : theirs ? ((cur.busy.name || 'A colleague') + ' is being answered in this conversation; wait for that answer…')
    : !busy ? (cur ? (cur.expired ? 'This conversation expired: a new question starts a new one…'
                      : cur.write ? 'Continue the conversation ' + (cur.ownerName ? 'shared by ' + cur.ownerName : '') + '…'
                      : 'Ask a follow-up…')
                   : 'Ask about this dataset…')
    : busy.chatId === activeId ? 'Answering…' : 'Waiting for the answer in another chat…';
  renderTopTools();
}
function autosize() { qBox.style.height = 'auto'; qBox.style.height = Math.min(qBox.scrollHeight, 200) + 'px'; }
qBox.addEventListener('input', () => { autosize(); updateComposer(); });
qBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
$('composer').addEventListener('submit', e => {
  e.preventDefault();
  if (busy && busy.chatId === activeId && busy.stop) busy.stop(); else ask();
});

function ask(text, opts) {
  const q = (text !== undefined ? text : qBox.value).trim();
  if (!q || busy) return;
  if (activeChat() && !canWrite(activeChat())) return;
  if (activeChat() && activeChat().busy && activeChat().busy.user !== ME) return;

  let chat = activeChat();
  if (!chat) {
    const now = Date.now();
    chat = { id: uid(), title: titleFor(q), created: now, updated: now, thread: null, turns: [] };
    chats.unshift(chat);
    activeId = chat.id;
    threadEl.textContent = '';
    $('chat-title').textContent = chat.title;
  }
  // Asked from the library (a card, or a question put in the box from the list and
  // sent as it is): the server counts it for that question.
  const from = (opts && opts.from) || (LIB_PICK && LIB_PICK.text.trim() === q ? LIB_PICK.id : null);
  LIB_PICK = null;
  if (from) bumpLibraryUse(from);
  const turn = { id: uid(), q, answer: '', cohort: null, link: null, error: '', steps: [], pending: true, at: Date.now() };
  chat.turns.push(turn);
  if (chat.turns.length > MAX_TURNS) chat.turns.shift();
  chat.updated = Date.now();
  busy = { chatId: chat.id, turnId: turn.id };
  save();

  qBox.value = ''; autosize(); updateComposer();
  threadEl.querySelectorAll('.hero, .followups').forEach(n => n.remove());
  threadEl.appendChild(turnNode(turn));
  renderSidebar();
  scrollDown(true);

  const src = new EventSource(
    'ask?q=' + encodeURIComponent(q) + '&dataset=' + encodeURIComponent(DATASET) +
    (chat.thread ? '&thread=' + encodeURIComponent(chat.thread) : '') +
    (MODEL ? '&model=' + encodeURIComponent(MODEL) : '') +
    (from ? '&from=' + encodeURIComponent(from) : ''));
  const parse = e => { try { return JSON.parse(e.data); } catch (_) { return null; } };

  // The server's id for this conversation, sent back with each follow-up so "how many
  // of them are women?" continues from the cohorts already built.
  src.addEventListener('thread', e => {
    const id = parse(e); if (!id) return;
    // A different id back for an existing conversation means the server no longer had
    // it (idle past its expiry, or deleted), so this answer starts without the earlier
    // questions. Say so, or "them" in the question would silently mean nothing.
    if (chat.thread && id !== chat.thread) {
      turn.fresh = true;
      if (chat.readonly) {
        // not continued in the colleague's conversation after all: this question and its
        // answer become a conversation of this person's own
        chat.turns = chat.turns.filter(t => t !== turn);
        const own = { id: uid(), title: titleFor(q), created: Date.now(), updated: Date.now(), thread: id, turns: [turn], sharedWith: [] };
        chats.unshift(own);
        busy.chatId = own.id;
        activeId = own.id;
        chat = own;
        renderSidebar(); renderThread();
      }
    }
    chat.thread = id; chat.expired = false; chat.remote = false; save();
  });
  src.addEventListener('step', e => {
    const tool = parse(e); if (!tool) return;
    const label = STEP_LABELS[tool] || String(tool).replace(/_/g, ' ');
    const last = turn.steps[turn.steps.length - 1];
    const same = turn.steps.find(s => s.label === label);
    if (same) { same.n += 1; if (same !== last) { turn.steps.splice(turn.steps.indexOf(same), 1); turn.steps.push(same); } }
    else turn.steps.push({ label, n: 1 });
    repaint(turn);
  });
  // The answer's trace: started, built step by step as Claude works, then finished
  // with its totals and checks (see the traces section below).
  src.addEventListener('trace_start', e => {
    const h = parse(e); if (!h || !h.id) return;
    turn.trace = { id: h.id };
    LIVE[turn.id] = { turn, head: h, steps: [], byId: {}, tail: null, at: performance.now(), lastT: 0 };
    save();
    repaintTrace(turn);
  });
  src.addEventListener('trace', e => {
    const s = parse(e), live = LIVE[turn.id]; if (!s || !live) return;
    if (live.byId[s.id]) Object.assign(live.byId[s.id], s);
    else { live.byId[s.id] = s; live.steps.push(s); }
    live.lastT = Math.max(live.lastT, s.t1 == null ? s.t0 : s.t1);
    live.at = performance.now();
    repaintTrace(turn);
  });
  src.addEventListener('trace_end', e => {
    const t = parse(e), live = LIVE[turn.id]; if (!t || !t.id) return;
    if (live) live.tail = t;
    const checks = t.checks || [];
    turn.trace = {
      id: t.id, ms: t.ended, model: t.model, n: live ? live.steps.length : null,
      fail: checks.filter(c => c.level === 'fail').length,
      warn: checks.filter(c => c.level === 'warn').length,
    };
    bumpMyUsage(t.stats && t.stats.cost_usd);
    delete TRACES[t.id];   // fetch the finished record, not one taken mid-answer
    save();
    repaintTrace(turn);
  });
  src.addEventListener('link', e => { turn.link = parse(e); });
  src.addEventListener('deleted', e => { retireReport(parse(e)); });
  src.addEventListener('cohort', e => { turn.cohort = parse(e); });
  src.addEventListener('followups', e => { const f = parse(e); if (Array.isArray(f)) turn.followups = f; });
  src.addEventListener('answer', e => {
    turn.answer = parse(e) || '';
    turn.pending = false;
    save();
    repaint(turn, true);
  });
  src.addEventListener('error', e => {
    // A named error from the server carries data; a dropped connection does not, and
    // is handled by onerror below.
    if (!e.data) return;
    turn.error = parse(e) || 'Something went wrong.';
    turn.pending = false;
    save();
    repaint(turn, true);
  });
  src.addEventListener('done', () => { src.close(); finish(); });
  src.onerror = () => {
    src.close();
    if (turn.pending) {
      turn.pending = false;
      turn.error = 'The connection to the Ask server was lost. Ask again.';
      save();
      repaint(turn, true);
    }
    finish();
  };
  // Closing the stream is enough: the server notices within seconds and stops Claude.
  busy.stop = () => {
    src.close();
    if (turn.pending) {
      turn.pending = false;
      turn.error = 'Stopped.';
      save();
      repaint(turn, true);
    }
    finish();
  };
  updateComposer();
  function finish() {
    busy = null;
    chat.updated = Date.now();
    save(); renderSidebar(); updateComposer();
    refreshMyUsage();
    if (chat.id === activeId) qBox.focus();
    if (chat.readonly || chat.clonedFrom) setTimeout(() => refreshTurns(chat), 1500);
  }
}

// --- buttons under an answer ----------------------------------------------------------
function linkButton(link) {
  if (link.gone) return el('span', 'chiron-link gone', 'Report deleted');
  const a = el('a', 'chiron-link');
  a.href = link.url; a.target = '_top';
  a.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  a.appendChild(document.createTextNode(link.label || 'Open'));
  return a;
}

// A report deleted in a later answer must not stay clickable in earlier ones, in any
// conversation, now or after a reload.
function retireReport(id) {
  if (id == null) return;
  const re = new RegExp('/reports/' + Number(id) + '(/|$|\\?)');
  chats.forEach(c => c.turns.forEach(t => {
    if (t.link && re.test(t.link.url)) { t.link.gone = true; repaint(t); }
  }));
  save();
}

function loadButton(body, cohort) {
  const label = cohort.subject_count != null
    ? 'Query · ' + Number(cohort.subject_count).toLocaleString() : 'Query';
  const b = el('button', 'chiron-link load'); b.type = 'button';
  b.title = 'Load these filters into the Chiron query builder, replacing what is open there';
  const icon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>';
  const set = text => { b.innerHTML = icon; b.appendChild(document.createTextNode(text)); };
  set(label);
  b.onclick = async () => {
    b.disabled = true; set('Loading…');
    try {
      const r = await fetch('load', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cohort),
      });
      const res = await r.json();
      if (res.error) throw new Error(res.error);
      // Inside Chiron this page is an iframe: navigate the UI itself so the query
      // builder reloads with the new workspace.
      (window.top || window).location.href = res.url;
    } catch (err) {
      b.disabled = false; set(label);
      body.appendChild(el('div', 'err', err.message));
    }
  };
  return b;
}

// --- rendering an answer --------------------------------------------------------------
function render(target, markdown, meta) {
  Charts.sweep();
  // Pull out ```chart and ```report blocks before markdown parsing; Charts draws the charts
  // with Chart.js, Reports shows each report as a card that makes its PDF.
  const charts = [], reports = [];
  const text = markdown.replace(/```chart\s*([\s\S]*?)```/g, (_, body) => {
    try { charts.push(JSON.parse(body)); return `\n\n<div data-chart="${charts.length - 1}"></div>\n\n`; }
    catch (_) { return ''; }
  });
  const withReports = text.replace(/```report\s*([\s\S]*?)```/g, (_, body) => {
    // a line break inside a string (JSON does not allow one) is read as a space
    let spec;
    try { spec = JSON.parse(body); } catch (_) {
      try { spec = JSON.parse(body.replace(/\s*\n\s*/g, ' ')); } catch (_) { spec = { __bad: true }; }
    }
    reports.push(spec);
    return `\n\n<div data-report="${reports.length - 1}"></div>\n\n`;
  });

  // Answers can quote values straight from the data, so the HTML is sanitised: a value
  // that happens to contain markup must never run as script on Chiron's origin.
  target.innerHTML = DOMPurify.sanitize(marked.parse(withReports, { breaks: true }));

  // Links into Chiron are offered as buttons from the server's own record of what was
  // saved, so any the model wrote into its prose are reduced to plain text. Others
  // open in a new tab.
  target.querySelectorAll('a').forEach(a => {
    if (/\/(query|results|reports)(\/|$|\?)/.test(a.getAttribute('href') || '')) {
      a.replaceWith(document.createTextNode(a.textContent));
    } else {
      a.target = '_blank'; a.rel = 'noopener noreferrer';
    }
  });

  // Tables get their own scroll container so a wide one never widens the page.
  target.querySelectorAll('table').forEach(t => {
    const wrap = el('div', 'table-wrap');
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });

  target.querySelectorAll('[data-chart]').forEach(slot => {
    const card = Charts.card(charts[Number(slot.dataset.chart)], meta);
    if (card) slot.replaceWith(card); else slot.remove();
  });
  target.querySelectorAll('[data-report]').forEach(slot => {
    slot.replaceWith(Reports.card(reports[Number(slot.dataset.report)], meta));
  });
}

const ISO_DAY = /^\d{4}(-\d{2}){0,2}$/;
// A date as a number of days, so readings sit where their dates fall; no date adapter.
function dayOf(x) {
  const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(String(x));
  return m ? Date.UTC(+m[1], m[2] ? +m[2] - 1 : 0, m[3] ? +m[3] : 1) / 864e5 : NaN;
}

// --- charts ----------------------------------------------------------------------------
// A ```chart block (see the answering rules in webapp.py) is one series as data:[{x,y}], or
// several as x:[...] with series:[{label, y:[...]}]; type bar, line or doughnut. Each one is
// drawn as a card: the title and a subtitle (what is counted, which dataset) above the
// chart, Image / CSV / Table buttons, and a hover box that gives the number first.
// - Bars with long names lie sideways, each with its number at its end; a doughnut is
//   drawn the same way, with each part's share. Upright bars carry their numbers when
//   they fit, else a value axis does.
// - Counts over time start at zero, with the latest value and the peak labelled;
//   measurements (averages, one patient's readings) get an axis fitted to them.
// - Full color: each of a few categories, and each part of a whole, has its own color from a
//   palette checked for color blindness (a series or part past the eighth is gray); ordered
//   groups (ages, years) and long lists step from teal to purple; a line runs teal to purple
//   over a soft shade; parts of a whole also get a strip that shows the whole at a glance.
// - Image saves the chart as a PNG. Excel saves its numbers as a formatted spreadsheet, built
//   in the browser with ExcelJS (loaded the first time; plain CSV when it cannot load, and in
//   the table view). Table shows the numbers in the page.
// - A value that is not a number ("<11") is shown as written, without a bar.
const Charts = (() => {
  const PALETTE = ['#00897b', '#7b1fa2', '#ef6c00', '#d81b60', '#ff8f00', '#e53935', '#1e88e5', '#388e3c'];
  const GRAYS = ['#98a2ab', '#6b7780', '#c4ccd2'];
  const INK = '#1d2328', INK2 = '#3c464f', MUTED = '#6b7780', FAINT = '#98a2ab';
  const GRID = '#eef1f3', BASE = '#cfd6db', LINE = '#e3e7ea', SURFACE = '#ffffff';
  const FONT = (getComputedStyle(document.documentElement).getPropertyValue('--font') || '').trim()
    || 'Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
  const NF0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const NF1 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
  const NF2 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
  const NFS = new Intl.NumberFormat('en-US', { maximumSignificantDigits: 3 });
  const NFC = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // Words in a chart's label (or title) that say whether a line counts things (zero-based)
  // or measures them (an axis fitted to the values).
  const MEASURES = /%|\b(average|avg|mean|median|rate|percent(age)?|share|age|bmi|scores?|mmhg|mg|kg|lbs?|levels?|pressure|ratio|index|weight|height|temperature|glucose|a1c|hba1c|cholesterol)\b/i;
  const COUNTS = /\b(patients?|people|persons?|subjects?|diagnos\w*|visits?|encounters?|cases?|counts?|number|admissions?|prescriptions?|records?|events?|procedures?|conditions?|medications?|claims?|deaths?|births?)\b/i;
  // Labels that are steps on a scale (ages, ranges, numbers): ordered groups. Bands in
  // words count too: "Under 18", "18 to 39", "65 and over", "80 years or older".
  const ORDERED = /^\s*(?:(?:[<>≤≥]=?|under|below|over|above|less than|more than|fewer than|at least|at most|up to)\s*)?\d[\d,.]*\s*(?:(?:-|–|to)\s*\d[\d,.]*)?\s*(?:\+|years?|yrs?|y|months?|mo|days?|d|%)?\s*(?:(?:and|or)\s+(?:over|older|above|more|up|under|younger|less|below))?\s*$/i;
  const DRAWN = new Set();     // charts already shown once: a repaint does not animate them again
  let measurer = null;

  const color = i => (i < PALETTE.length ? PALETTE[i] : GRAYS[(i - PALETTE.length) % GRAYS.length]);
  const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const x = hexRGB(a), y = hexRGB(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  // teal, blue, purple: the run of colors for ordered groups, long lists and lines
  const ramp = t => (t <= 0.5 ? mix(PALETTE[0], PALETTE[6], t * 2) : mix(PALETTE[6], PALETTE[1], (t - 0.5) * 2));
  // text on a colored fill: near-black on light colors (amber, light gray), white on the rest
  const inkOn = h => { const [r, g, b] = hexRGB(h); return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? INK : SURFACE; };
  const reducedMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function number(v) {
    if (v == null || !isFinite(v)) return '';
    if (Number.isInteger(v)) return NF0.format(v);
    const a = Math.abs(v);
    return a >= 100 ? NF1.format(v) : a >= 1 ? NF2.format(v) : NFS.format(v);
  }
  // A value as the model wrote it: a number, or text such as "1,234", "12.5%" or "<11".
  function cell(raw) {
    if (typeof raw === 'number') return isFinite(raw) ? { v: raw, t: number(raw) } : { v: null, t: '' };
    if (typeof raw !== 'string') return { v: null, t: '' };
    const s = raw.trim();
    if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) { const v = Number(s); return { v, t: number(v) }; }
    const plain = s.replace(/[,\s  ]/g, '').replace(/^[$€£]/, '').replace(/%$/, '');
    if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(plain)) return { v: Number(plain), t: s };
    return { v: null, t: s };
  }
  function measure(text, font) {
    measurer = measurer || document.createElement('canvas').getContext('2d');
    measurer.font = font;
    return measurer.measureText(text).width;
  }
  // Text cut to a width in pixels, with an ellipsis (the whole text is in the hover box and the table).
  function fit(text, maxPx, font) {
    text = String(text);
    if (measure(text, font) <= maxPx) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (measure(text.slice(0, mid).trimEnd() + '…', font) <= maxPx) lo = mid; else hi = mid - 1;
    }
    return text.slice(0, lo).trimEnd() + '…';
  }
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`; };
  const darker = (hex, t) => {
    const n = parseInt(hex.slice(1), 16);
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.round(c * (1 - t)).toString(16).padStart(2, '0')).join('');
  };
  const lastIndex = vals => { for (let i = vals.length - 1; i >= 0; i--) if (vals[i] != null) return i; return -1; };
  const most = (list, f) => list.reduce((m, x, i) => Math.max(m, f(x, i)), 0);
  function fullDate(label) {
    const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(label);
    if (!m || !m[2]) return label;
    const mon = MONTHS[+m[2] - 1] || m[2];
    return m[3] ? `${mon} ${+m[3]}, ${m[1]}` : `${mon} ${m[1]}`;
  }
  function tickDate(d, style) {
    const t = new Date(d * 864e5), mon = MONTHS[t.getUTCMonth()];
    return style === 'day' ? `${mon} ${t.getUTCDate()}` : style === 'month' ? `${mon} ${t.getUTCFullYear()}` : String(t.getUTCFullYear());
  }

  // The chart block, read once, with the decisions the drawing makes.
  function read(spec) {
    if (!spec || typeof spec !== 'object' || Array.isArray(spec)) return null;
    const listed = Array.isArray(spec.x) && Array.isArray(spec.series);
    const rows = (Array.isArray(spec.data) ? spec.data : [])
      .map(r => (Array.isArray(r) ? { x: r[0], y: r[1] } : r)).filter(r => r && typeof r === 'object');
    let labels = (listed ? spec.x : rows.map(r => r.x)).map(x => (x == null || String(x).trim() === '' ? '(blank)' : String(x)));
    const column = ys => { const cs = labels.map((_, i) => cell(ys[i])); return { values: cs.map(c => c.v), texts: cs.map(c => c.t) }; };
    let series = listed
      ? spec.series.filter(sr => sr && typeof sr === 'object').map((sr, k) => ({
          label: sr.label == null || String(sr.label).trim() === '' ? `Series ${k + 1}` : String(sr.label),
          ...column(Array.isArray(sr.y) ? sr.y : []) }))
      : [{ label: spec.label == null ? '' : String(spec.label), ...column(rows.map(r => r.y)) }];
    if (!series.length) series = [{ label: '', ...column([]) }];
    const kind = String(spec.type || 'bar').toLowerCase();
    const type = /line|scatter|area/.test(kind) ? 'line' : 'bar';
    const n = labels.length;
    const years = type === 'line' && n > 1 && labels.every(x => /^\d{4}$/.test(x));
    const dates = type === 'line' && !years && n > 1 && labels.every(x => ISO_DAY.test(x) && isFinite(dayOf(x)));
    if (years || dates) {
      // a line through time runs in time order, whatever order the rows came in
      const at = labels.map(x => (years ? Number(x) : dayOf(x)));
      const order = labels.map((_, i) => i).sort((a, b) => at[a] - at[b]);
      if (order.some((o, i) => o !== i)) {
        labels = order.map(i => labels[i]);
        series = series.map(sr => ({ ...sr, values: order.map(i => sr.values[i]), texts: order.map(i => sr.texts[i]) }));
      }
    }
    const multi = series.length > 1;
    const values = series.flatMap(sr => sr.values).filter(v => v != null);
    const negative = values.some(v => v < 0);
    const ints = values.every(v => Number.isInteger(v));
    const total = series[0].values.reduce((a, v) => a + (v > 0 ? v : 0), 0);
    const parts = /doughnut|donut|pie|polar/.test(kind) && !multi && !negative && total > 0;
    const longest = most(labels, l => l.length);
    const horizontal = type === 'bar' && n > 0 && n <= 40 && (parts || longest > 12 || (n > 10 && longest > 4));

const TRACE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>';
const CHEV_ICON = '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const TRACE_UI = {};   // turn id -> { open, sel, keys }: what the reader has opened
const TRACES = {};     // trace id -> the full trace, or { loading } / { error }
const LIVE = {};       // turn id -> the trace as it streams in
// Each answer has its own Trace button; nothing opens them all at once.
const TRACE_ALL = false;
let TRACE_LEVEL = 'summary';

  TRACE_LEVEL = localStorage.getItem('chiron-ask:trace-level') || 'summary';
} catch (_) {}

const kindColor = k => `var(${(KINDS[k] || KINDS.note)[1]})`;
function uiFor(turn) {

}
function fmtMs(ms) {

}
function fmtTok(n) {

    : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
}
const fmtAt = ms => (ms / 1000).toFixed(ms < 100000 ? 1 : 0) + 's';
const num = v => (typeof v === 'number' ? v.toLocaleString() : String(v));

// A collapsed section whose content is only built when it is opened (outputs and the

// What to draw: the full record once fetched, else what has streamed in so far.
function traceView(turn) {
  const id = turn.trace && turn.trace.id, full = id && TRACES[id];
  if (full && full.steps) return full;
  const live = LIVE[turn.id];
  if (live) return Object.assign({ partial: true }, live.head, live.tail || {}, { steps: live.steps, done: !!live.tail });
  return null;
}
// Fetched whenever the panel opens and the copy here is missing, errored or not yet
// done; a record still being written is fetched again a few times, with backoff, while
// the panel stays open. The old one-shot fetch left a panel stuck on whatever the first
// try returned.
function ensureFull(turn, again) {
  const id = turn.trace && turn.trace.id;
  if (!id) return;
  const cur = TRACES[id];
  if (cur && cur.loading) return;
  // A record that is there and done needs no fetch; one that errored is fetched again
  // only on purpose (Retry, or a scheduled try), never by a repaint: a repaint after an
  // error would otherwise fetch again at once, without end.
  if (cur && !again && (cur.error || (cur.steps && cur.done))) return;
  const tries = (cur && cur.tries) || 0;
  TRACES[id] = { loading: true, tries };
  fetch('trace?id=' + encodeURIComponent(id), { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      if (d && d.steps) { TRACES[id] = d; d.tries = tries + 1; if (!d.done) scheduleRefetch(turn, tries + 1); }
      else TRACES[id] = { error: (d && d.error) || 'The trace could not be read.', tries: tries + 1 };
    })
    .catch(() => {
      TRACES[id] = { error: 'The trace could not be fetched from the Ask server.', tries: tries + 1 };
      scheduleRefetch(turn, tries + 1);
    })
    .then(() => repaintTrace(turn));
}
// At most five scheduled tries, 2, 4, 8, 10 and 10 seconds apart, while the panel is open.

    const ui = TRACE_UI[turn.id], cur = turn.trace && TRACES[turn.trace.id];
    if (ui && ui.open && !(cur && cur.loading) && !(cur && cur.steps && cur.done)) ensureFull(turn, true);

}
// Copy within the click itself, through a selected text area (synchronous, and it works

}

}
function findTurn(id) {

  return null;
}

function traceSlot(turn) {

  slot.dataset.traceFor = turn.id;

}
function repaintTrace(turn) {

}
function repaintAllTraces() {

  });
}
function renderTraceSlot(slot, turn) {
  // Keep the reader's place: a repaint must not scroll a long trace out from under them.
  const keep = scroller.scrollTop;
  // "Report a problem" (button, open form or thank-you note) sits beside the trace
  // button and is kept as it is across repaints of the trace.
  let report = slot.querySelector(':scope > [data-report]');
  let saveEl = slot.querySelector(':scope > [data-save]');

function traceBar(turn, ui) {

  if (live && !live.tail) bits.push(`${live.steps.length} steps so far`, fmtMs(liveNow(live)));
  else {
    if (sum.n != null) bits.push(`${sum.n} steps`);
    if (sum.ms != null) bits.push(fmtMs(sum.ms));
    if (sum.model) bits.push(sum.model);
    if (sum.fail) bits.push(`${sum.fail} failed`);

function tracePanel(turn, ui) {
  const box = el('div', 'trace');
  const data = traceView(turn);
  box.appendChild(traceHead(turn, data));
  if (!data) {
    const st = TRACES[turn.trace && turn.trace.id];
    const msg = el('div', 'tr-sec tr-msg', st && st.error ? st.error + ' ' : 'Loading the trace…');
    if (st && st.error) {
      const retry = el('button', 'mini-btn', 'Try again'); retry.type = 'button';
      retry.onclick = () => ensureFull(turn, true);

    }

  }
  const lvl = TRACE_LEVEL;
  if (data.calls) box.appendChild(whatSection(turn, data));
  if (data.stats && data.stats.total_ms != null) box.appendChild(statsSection(data));
  if (data.checks) box.appendChild(checksSection(turn, data));
  if (lvl !== 'summary' && data.figures && data.figures.length) box.appendChild(figuresSection(turn, data));
  box.appendChild(timelineSection(turn, data, ui));
  box.appendChild(storySection(turn, data, ui, lvl));

  // Each level says what the next one adds, so a press on the switch always shows.
  if (lvl === 'summary') box.appendChild(el('div', 'tr-sec tr-msg',
    'Detailed adds the model\'s reasoning, each tool\'s input and result, and where each figure came from. Debug adds the full inputs and outputs, token usage, the prompt, the command and the raw stream.'));
  else if (lvl === 'detailed') box.appendChild(el('div', 'tr-sec tr-msg',
    'Debug adds the full inputs and outputs, token usage, the prompt, the command and the raw stream.'));

// The model id as a name: "us.anthropic.claude-haiku-5-5" -> "Haiku 5.5".
function modelName(id) {
  const m = /claude-(opus|sonnet|haiku|fable)-(\d+)-(\d+)/.exec(id || '');

}
function buildsText(b, adds) {
  const what = [b.count != null ? num(b.count) + ' patients' : '', b.what || ''].filter(Boolean).join(': ');
  return `builds on ${b.group}` + (what ? ` (${what})` : '') + (adds ? ` · adds ${adds}` : '');

// What the answer rested on, in words: the model calls, each Chiron call and what it

function whatSection(turn, data) {
  const c = data.calls, sec = el('div', 'tr-sec');
  sec.appendChild(el('h4', null, 'What happened'));
  const rows = [];
  const calls = c.model_calls || 0;
  rows.push(['Model', `${calls} call${calls === 1 ? '' : 's'} to ${modelName(c.model)} on ${c.via}` +
    (c.retries ? `, ${c.retries} retr${c.retries === 1 ? 'y' : 'ies'} while the API was busy` : '') +
    (c.followup ? '; the conversation so far was in its context' : '')]);
  const tools = c.tools || [];
  if (!tools.length) {
    rows.push(['Chiron', c.followup
      ? 'no new query: answered from the earlier results' + (c.inherited ? '; the Query button carries the previous cohort' : '')
      : 'no tool was called']);
  } else {
    const list = el('div', 'what-list');
    tools.forEach((t, i) => {
      const line = el('div', 'what-call' + (t.status === 'error' ? ' err' : ''));
      line.appendChild(el('b', null, `${i + 1}. ${t.label || t.name}`));
      line.appendChild(el('span', null, t.status === 'error'
        ? `rejected: ${t.summary || ''}`
        : (t.summary || '') + (t.returned ? ` · returned ${t.returned}` : '')));
      const go = el('button', 'link-btn', 'Show step'); go.type = 'button';
      go.onclick = () => jumpTo(turn, t.id);
      line.appendChild(go);
      if (t.builds_on) line.appendChild(el('span', 'builds', buildsText(t.builds_on, t.adds)));
      list.appendChild(line);
    });
    rows.push(['Chiron', list]);
    rows.push(['Data', c.rows
      ? `${num(c.rows)} row${c.rows === 1 ? '' : 's'} of patient data came back because a list or a patient's records were asked for: only the requested columns, within this account's access level`
      : 'only counts and aggregates came back; no patient rows left Chiron']);
  }
  const f = c.figures || {};
  if (f.total) {
    const bits = [];
    if (f.tool) bits.push(`${f.tool} from tool results`);
    if (f.question) bits.push(`${f.question} from the question or the conversation's groups`);
    if (f.earlier) bits.push(`${f.earlier} from earlier answers`);
    if (f.derived) bits.push(`${f.derived} derived`);
    if (f.missing) bits.push(`${f.missing} from no tool`);
    rows.push(['Figures', f.tool === f.total ? `all ${f.total} come from tool results` : `${f.total}: ${bits.join(', ')}`,
      f.missing ? 'warn' : null]);

  sec.appendChild(kv(rows));
  return sec;

function traceHead(turn, data) {
  const head = el('div', 'tr-head');
  const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Detail level');
  LEVELS.forEach(([key, name]) => {
    const b = el('button', null, name); b.type = 'button';
    b.setAttribute('aria-pressed', TRACE_LEVEL === key ? 'true' : 'false');
    b.title = { summary: 'Timeline, checks and one line per step',
                detailed: 'Plus the model\'s reasoning, each tool\'s input and result, and where each figure came from',
                debug: 'Plus full inputs and outputs, token usage, the prompt, the command and the raw stream' }[key];
    b.onclick = () => {
      TRACE_LEVEL = key;
      try { localStorage.setItem('chiron-ask:trace-level', key); } catch (_) {}
      repaintAllTraces();
    };
    seg.appendChild(b);
  });
  head.appendChild(seg);
  const meta = [];
  if (data) {
    if (data.steps) meta.push(`${data.steps.length} steps` + (data.done ? '' : ' so far'));
    if (data.stats && data.stats.total_ms != null) meta.push(fmtMs(data.stats.total_ms));
    if (data.model) meta.push(data.model);
    if (data.claude_version) meta.push('Claude Code ' + data.claude_version);
    if (data.followup_lost) meta.push('conversation had expired: asked as a new one');
    else if (data.followup) meta.push(`follow-up #${data.turn}, continuing the conversation`);
    else meta.push('new conversation');
    if (data.dataset) meta.push(data.dataset);
  }
  head.appendChild(el('div', 'tr-meta', meta.join(' · ')));
  const tools = el('div', 'tr-tools');
  const full = turn.trace && TRACES[turn.trace.id];
  // The full record when it is there; else what has streamed in, marked partial.
  const complete = !!(full && full.steps && full.done);
  const record = complete ? full : (data && data.steps ? Object.assign({ partial: true }, data) : null);
  const text = () => JSON.stringify(record, null, 2);
  const copy = el('button', 'mini-btn', 'Copy JSON'); copy.type = 'button'; copy.disabled = !record;
  copy.title = complete ? 'Copy the whole trace, to paste into a bug report or compare models'
                        : 'Copy what has been recorded so far (the full record is still being fetched)';
  copy.onclick = () => {
    copyText(text())
      .then(() => { copy.textContent = complete ? 'Copied' : 'Copied (partial)'; setTimeout(() => (copy.textContent = 'Copy JSON'), 1800); })
      .catch(() => { copy.textContent = 'Copy blocked: use Download'; setTimeout(() => (copy.textContent = 'Copy JSON'), 2500); });
  };
  const dl = el('button', 'mini-btn', 'Download'); dl.type = 'button'; dl.disabled = !record;
  dl.title = complete ? 'Save the whole trace as a JSON file' : 'Save what has been recorded so far as a JSON file';
  dl.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text()], { type: 'application/json' }));
    a.download = `chiron-ask-trace-${(record && record.id) || turn.id}${complete ? '' : '-partial'}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  tools.append(copy, dl);
  head.appendChild(tools);
  return head;
}

function statsSection(data) {
  const sec = el('div', 'tr-sec');
  const st = data.stats, box = el('div', 'stats');
  const tile = (value, label, title) => {
    const t = el('div', 'stat'); if (title) t.title = title;
    t.append(el('b', null, value), el('span', null, label)); box.appendChild(t);
  };
  tile(fmtMs(st.total_ms), 'total time');
  tile(fmtMs(st.model_ms), `model · ${st.model_calls} call${st.model_calls === 1 ? '' : 's'}`,
       'Time the model spent reasoning and writing (between tool calls)');
  tile(fmtMs(st.chiron_ms), `Chiron · ${st.tool_calls} call${st.tool_calls === 1 ? '' : 's'}` +
       (st.tool_errors ? ` · ${st.tool_errors} rejected` : ''), 'Time inside Chiron tools (overlapping calls counted once)');
  tile(fmtMs(st.startup_ms), 'start-up', 'Starting Claude Code and connecting the Chiron tools');
  tile(fmtMs(st.post_ms), 'server checks', 'Re-counting the cohort for the Query button, reading follow-ups and charts');
  if (st.retry_ms) tile(fmtMs(st.retry_ms), 'waiting on retries');
  tile(`${fmtTok(st.input_tokens)} / ${fmtTok(st.output_tokens)}`, 'tokens in / out',
       `Input includes ${fmtTok(st.cache_read_tokens)} read from cache` +
       (st.thinking_tokens ? `; output includes ${fmtTok(st.thinking_tokens)} of reasoning` : ''));
  if (st.cost_usd != null) tile('$' + st.cost_usd.toFixed(st.cost_usd < 0.1 ? 4 : 3), 'cost (API list price)',
       'Claude Code\'s own cost figure for this answer; on a subscription this is what it would cost on the API');
  else if (st.cost_usd_cumulative != null) tile('$' + st.cost_usd_cumulative.toFixed(3), 'cost, whole conversation',
       'Claude Code reports cost summed over the conversation; the previous answer was not traced, so this answer\'s share is unknown');
  sec.appendChild(box);
  const total = st.total_ms || 1, split = el('div', 'split');
  const other = Math.max(0, total - st.startup_ms - st.model_ms - st.chiron_ms - st.post_ms - (st.retry_ms || 0));
  [['startup', st.startup_ms], ['model', st.model_ms], ['tool', st.chiron_ms], ['retry', st.retry_ms || 0],
   ['post', st.post_ms], ['note', other]].forEach(([k, v]) => {
    if (v <= 0) return;
    const i = el('i'); i.style.width = (100 * v / total) + '%'; i.style.background = kindColor(k);
    i.title = `${(KINDS[k] || ['Other'])[0] === 'Note' ? 'Other (gaps, overlap)' : KINDS[k][0]}: ${fmtMs(v)}`;
    split.appendChild(i);
  });
  sec.appendChild(split);
  return sec;
}

function checksSection(turn, data) {
  const sec = el('div', 'tr-sec');
  sec.appendChild(el('h4', null, 'Checks'));
  const list = el('div', 'checks');
  if (!data.checks.length) list.appendChild(el('div', 'tr-msg', 'Nothing to report.'));
  data.checks.forEach(c => {
    const row = el('div', 'check ' + c.level);
    row.appendChild(el('span', 'ic', CHECK_ICON[c.level] || '•'));
    const txt = el('div');
    txt.appendChild(el('div', 't', c.title));

    row.appendChild(txt);
    if (c.step) {

      go.onclick = () => jumpTo(turn, c.step);

    list.appendChild(row);
  });
  sec.appendChild(list);

}

function figuresSection(turn, data) {
  const sec = el('div', 'tr-sec');
  sec.appendChild(el('h4', null, 'Where the answer\'s figures came from (10 and up)'));
  const t = el('table', 'figs');
  t.innerHTML = '<thead><tr><th>Figure</th><th>Source</th></tr></thead>';
  const tb = el('tbody');
  data.figures.forEach(f => {
    const tr = el('tr', f.status);
    tr.appendChild(el('td', null, f.text));
    const td = el('td');
    if (f.status === 'tool') {
      const go = el('button', 'link-btn', `${f.label} (${f.tool})`); go.type = 'button';
      go.onclick = () => jumpTo(turn, f.step);
      td.append('In the result of ', go);
    } else {
      td.textContent = {
        question: 'In the question or the dataset description',
        earlier: 'From an earlier answer in this conversation',
        derived: 'Worked out by the model (a percentage or decimal); in no tool result',
        missing: 'In no tool result: computed by the model or made up',
      }[f.status] || f.status;
      if (f.near) {
        const go = el('button', 'link-btn', `${num(f.near.value)} from ${f.near.label} (${f.near.tool})`); go.type = 'button';
        go.onclick = () => jumpTo(turn, f.near.step);

    tr.appendChild(td);

  t.appendChild(tb);

}

function niceStep(total, most) {
  const steps = [100, 200, 500, 1e3, 2e3, 5e3, 1e4, 15e3, 3e4, 6e4, 12e4, 3e5, 6e5];
  return steps.find(s => total / s <= most) || 6e5;
}

function timelineSection(turn, data, ui) {
  const sec = el('div', 'tr-sec');
  sec.appendChild(el('h4', null, 'Timeline'));
  const live = LIVE[turn.id];
  const steps = data.steps || [];
  const total = Math.max(1, data.ended != null ? data.ended
    : live ? liveNow(live) : Math.max(0, ...steps.map(s => s.t1 == null ? s.t0 : s.t1)));
  const axis = el('div', 'tl-axis');
  axis.appendChild(el('div'));
  const ticks = el('div', 'tl-ticks');
  // Fewer, rounder ticks on a phone, where the time axis is narrow.
  const every = niceStep(total, innerWidth < 760 ? 3 : 6);
  for (let t = 0; t <= total; t += every) {
    const s = el('span', null, (t / 1000).toFixed(every < 1000 ? 1 : 0) + 's');
    s.style.left = (100 * t / total) + '%'; ticks.appendChild(s);
  }
  axis.appendChild(ticks);
  sec.appendChild(axis);
  const gridAt = [];
  for (let t = every; t < total; t += every) gridAt.push(100 * t / total);

  steps.forEach(s => {
    const row = el('div', 'tl-row' + (ui.sel === s.id ? ' sel' : '') + (s.status === 'error' ? ' error' : ''));
    const end = s.t1 == null ? total : s.t1;
    const dur = end - s.t0;
    row.title = `${s.label}\n${fmtAt(s.t0)} → ${s.t1 == null ? 'still running' : fmtAt(s.t1)}  (${fmtMs(dur)})` +
      (s.summary ? `\n${s.summary}` : '');
    const name = el('div', 'tl-name' + (s.kind === 'tool' ? ' sub' : ''));
    const dot = el('span', 'kdot'); dot.style.background = kindColor(s.status === 'error' ? 'error' : s.kind);
    name.append(dot, el('span', null, (s.kind === 'tool' ? '↳ ' : '') + s.label));
    const track = el('div', 'tl-track');
    gridAt.forEach(p => { const g = el('i', 'tl-grid'); g.style.left = p + '%'; track.appendChild(g); });
    const left = 100 * s.t0 / total, width = 100 * dur / total;
    const color = kindColor(s.status === 'error' ? 'error' : s.status === 'warn' && s.kind !== 'retry' ? 'retry' : s.kind);
    if (s.t1 != null && dur <= 0) {
      const m = el('i', 'tl-mark'); m.style.left = left + '%'; m.style.background = color; track.appendChild(m);
    } else {
      const bar = el('i', 'tl-bar' + (s.t1 == null ? ' running' : ''));
      bar.style.left = left + '%'; bar.style.width = Math.max(width, 0.4) + '%'; bar.style.background = color;
      track.appendChild(bar);
      const lab = el('span', 'tl-dur', fmtMs(dur));
      if (left + width < 82) lab.style.left = `calc(${left + width}% + 5px)`;
      else lab.style.right = `calc(${100 - left}% + 5px)`;
      track.appendChild(lab);
    }
    row.append(name, track);
    row.onclick = () => jumpTo(turn, s.id);
    sec.appendChild(row);
  });
  const legend = el('div', 'legend');
  const used = new Set(steps.map(s => s.status === 'error' ? 'error' : s.kind));
  Object.keys(KINDS).filter(k => used.has(k)).forEach(k => {
    const s = el('span'); const d = el('span', 'kdot'); d.style.background = kindColor(k);
    s.append(d, KINDS[k][0]); legend.appendChild(s);
  });
  sec.appendChild(legend);
  return sec;
}

function jumpTo(turn, sid) {
  const ui = uiFor(turn);
  ui.sel = sid; ui.open = true;
  repaintTrace(turn);
  const card = threadEl.querySelector(`.trace-slot[data-trace-for="${turn.id}"] [data-step="${sid}"]`);
  if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function storySection(turn, data, ui, lvl) {
  const sec = el('div', 'tr-sec');
  sec.appendChild(el('h4', null, lvl === 'summary' ? 'Steps (click one for its details)' : 'Steps'));
  const list = el('div', 'story');
  (data.steps || []).forEach(s => list.appendChild(stepCard(turn, data, s, ui, lvl)));
  sec.appendChild(list);
  return sec;
}

function stepCard(turn, data, s, ui, lvl) {
  const card = el('div', 'st' + (s.status === 'error' ? ' error' : s.status === 'warn' ? ' warn' : '') +
    (ui.sel === s.id ? ' sel' : ''));
  card.dataset.step = s.id;
  const h = el('div', 'st-h');
  const dot = el('span', 'kdot'); dot.style.background = kindColor(s.status === 'error' ? 'error' : s.kind);
  const lab = el('div', 'st-l', (s.kind === 'tool' ? '↳ ' : '') + s.label);
  if (s.summary) lab.appendChild(el('small', null, s.summary));
  if (s.builds_on) lab.appendChild(el('small', 'builds', buildsText(s.builds_on, s.adds)));
  const dur = s.t1 == null ? 'running…' : s.t1 > s.t0 ? fmtMs(s.t1 - s.t0) : '';
  h.append(el('span', 'st-t', fmtAt(s.t0)), dot, lab, el('span', 'st-d', dur));
  h.onclick = () => { ui.sel = ui.sel === s.id ? null : s.id; repaintTrace(turn); };
  card.appendChild(h);
  if (lvl !== 'summary' || ui.sel === s.id) {
    const body = stepBody(turn, data, s, ui, lvl === 'summary' ? 'detailed' : lvl);
    if (body.childNodes.length) card.appendChild(body);
  }
  return card;
}

function stepBody(turn, data, s, ui, lvl) {
  const b = el('div', 'st-b');
  const debug = lvl === 'debug';
  if (s.kind === 'request') {
    b.appendChild(block('Question', el('div', 'said', data.question || '')));
    if (data.previous && data.previous.length) {
      const ol = el('ul', 'cd'); data.previous.forEach(q => ol.appendChild(el('li', null, q)));
      b.appendChild(block('Earlier questions in this conversation (the model has their context)', ol));
    }
    if (data.inherited && data.inherited.length) {
      b.appendChild(block('Cohort behind the previous answer\'s Query button', cohortList(data.inherited)));
    }
  } else if (s.kind === 'model') {
    if (s.thinking) b.appendChild(block('Reasoning (the model\'s own summary)', el('div', 'think', s.thinking)));
    else if (s.thinking_tokens) b.appendChild(el('div', 'faint',
      `Reasoned for about ${num(s.thinking_tokens)} tokens; the reasoning text was not recorded.`));
    const said = (s.text || []).join('\n\n');
    if (said && s.chose && s.chose.length) b.appendChild(block('Said', el('div', 'said', said)));
    else if (said) b.appendChild(lazy(ui, s.id + ':said', `The answer as written, before the server tidied it (${num(said.length)} characters)`,
      () => el('div', 'said', said)));
    if (s.chose && s.chose.length) b.appendChild(block('Chose', chips(s.chose)));
    const u = s.usage || {};
    const ctx = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
    b.appendChild(kv([
      ['Context sent', ctx ? `${num(ctx)} tokens (${num(u.cache_read_input_tokens || 0)} from cache)` : null],
      ['Time to first token', s.ttft != null ? fmtMs(s.ttft) : null],
      ['Stopped because', debug ? s.stop_reason : null],
      ['Message id', debug ? s.msg_id : null],
    ]));
    if (debug && s.usage) b.appendChild(lazy(ui, s.id + ':usage', 'Token usage (raw)', () => pre(json(s.usage))));
  } else if (s.kind === 'tool') {
    toolBody(b, turn, data, s, ui, debug);
  } else if (s.kind === 'post') {
    postBody(b, turn, data, ui, debug);
  } else if (s.kind === 'startup') {
    b.appendChild(kv([['Model', data.model], ['Claude Code', data.claude_version],
      ['Chiron tools', (data.mcp_servers || []).map(m => `${m.name}: ${m.status}`).join(', ')],
      ['Tools offered', debug ? (data.tools || []).join(', ') : (data.tools || []).length || null]]));
  } else if (s.kind === 'retry' && debug && s.detail) {
    b.appendChild(pre(json(s.detail)));
  }
  return b;
}

function cohortList(lines) {
  if (!lines || !lines.length) return el('div', 'faint', 'Empty: no filters yet (every patient).');
  const ul = el('ul', 'cd'); lines.forEach(l => ul.appendChild(el('li', null, l))); return ul;
}

function toolBody(b, turn, data, s, ui, debug) {
  const inp = s.input || {};
  const t = inp.transformation || null;
  b.appendChild(kv([
    ['Tool', el('span', 'mono', s.tool || '')],
    ['Dataset', inp.dataset_id, s.off_dataset ? 'warn' : null],
    ['Variable', inp.concept_id],
    ['Running for', s.still_running_s ? `${s.still_running_s} s when last heard from` : null],
  ]));
  if (t) {
    const sel = t.selected_categories;
    b.appendChild(block('Change asked for', kv([
      ['Type', t.type], ['Variable', t.concept_id],
      ['Values', Array.isArray(sel) ? chips(sel) : null],
      ['Excluding them', t.exclude_selected ? 'yes: has a record that is something else' : null, 'warn'],
      ['From', t.cd_numeric_min], ['To', t.cd_numeric_max], ['Date query', t.query_type],
      ['Text terms', t.chiron_text_field_selection],
      ['Rule', t.rule_operator != null ? `${t.rule_operator} ${t.rule_count}` : null],
      ['Entry', t.entry_id],
    ])));
  }
  if (s.cohort) b.appendChild(block('Cohort handed in', cohortList(s.cohort)));
  const rest = Object.keys(inp).filter(k => !['dataset_id', 'concept_id', 'cohort_def', 'transformation'].includes(k));
  if (rest.length) b.appendChild(block('Other input', kv(rest.map(k => [k, typeof inp[k] === 'object' ? JSON.stringify(inp[k]) : inp[k]]))));
  if (s.facts && s.facts.length) b.appendChild(block('Result', kv(s.facts)));
  if (s.describe) b.appendChild(block('Chiron\'s description of the result', el('div', 'desc', s.describe)));
  const full = s.output !== undefined && s.output !== null ? json(s.output) : s.output_text || null;
  const text = full || s.output_preview;
  if (text) b.appendChild(lazy(ui, s.id + ':out', `Output${s.output_size ? ' (' + kb(s.output_size) + ')' : ''}` +
    (full ? '' : ' · preview'), () => pre(text)));
  if (debug) {
    b.appendChild(lazy(ui, s.id + ':in', 'Input (raw)', () => pre(json(inp))));
    b.appendChild(kv([['Call id', s.call_id], ['Cohort fingerprint', s.cohort_hash]]));
  }
}

function postBody(b, turn, data, ui, debug) {
  const p = data.post;
  if (!p) { b.appendChild(el('div', 'faint', 'Available once the answer is done.')); return; }
  const c = p.cohort || {};
  const rows = [
    ['Query button', c.offered != null ? `offered, for ${num(c.offered)} patients` : 'not offered', c.offered != null ? 'ok-t' : null],
    ['Why not', c.offered == null ? c.reason : null],
    ['The answer leads with', c.figure != null ? num(c.figure) : c.source ? 'no figure' : null],
    ['Cohort taken from', c.source],
    ['Re-counted', c.verified != null ? `${num(c.verified)} patients` : null],
    ['Re-check failed', c.verify_error],
    ['A breakdown group', c.subgroup ? (c.subgroup.found ? `matched: ${num(c.subgroup.count)} patients` : 'no group had that figure') : null],
  ];
  b.appendChild(block('Query button', kv(rows)));
  if (c.cohort && c.cohort.length) b.appendChild(block('That cohort', cohortList(c.cohort)));
  if (p.link) b.appendChild(kv([['Button to Chiron', `${p.link.label} (${p.link.mode || 'link'})`]]));
  if (p.deleted && p.deleted.length) b.appendChild(kv([['Reports deleted', p.deleted.join(', ')]]));
  if (p.followups && p.followups.length) {
    const ul = el('ul', 'cd');
    p.followups.forEach(f => {
      const li = el('li');
      li.appendChild(el('span', f.shown ? 'ok-t' : 'no-t', f.shown ? '✓ ' : '✕ '));
      li.append(f.q + (f.shown ? '' : ` (${f.why})`));
      ul.appendChild(li);
    });
    b.appendChild(block('Suggested follow-ups', ul));
  } else b.appendChild(kv([['Suggested follow-ups', 'none written']]));
  (p.charts || []).forEach((ch, i) => {
    const box = el('div');
    box.appendChild(kv([['Chart ' + (i + 1), ch.ok ? ((ch.spec && ch.spec.title) || 'untitled') : 'not valid: dropped from the page', ch.ok ? null : 'warn']]));
    if (ch.issues && ch.issues.length) { const ul = el('ul', 'cd'); ch.issues.forEach(x => ul.appendChild(el('li', 'no-t', x))); box.appendChild(ul); }
    box.appendChild(lazy(ui, 'chart' + i, 'Chart spec', () => pre(ch.ok ? json(ch.spec) : ch.source)));
    b.appendChild(block('Chart', box));
  });
  (p.reports || []).forEach((rp, i) => {
    const box = el('div');
    const ok = rp.ok && rp.spec && typeof rp.spec === 'object';
    box.appendChild(kv([['PDF report ' + (i + 1), ok ? (rp.spec.title || 'untitled') : 'not readable: no PDF', ok ? null : 'warn']]));
    if (rp.issues && rp.issues.length) { const ul = el('ul', 'cd'); rp.issues.forEach(x => ul.appendChild(el('li', 'no-t', x))); box.appendChild(ul); }
    box.appendChild(lazy(ui, 'report' + i, 'Report spec', () => pre(ok ? json(rp.spec) : rp.source)));
    b.appendChild(block('Report', box));
  });
  const td = p.tidy || {};
  if (td.changed) b.appendChild(kv([['Tidied', [
    td.links_removed ? `${td.links_removed} link(s) into Chiron removed` : '',
    td.emails_redacted ? `${td.emails_redacted} email address(es) redacted` : '',
    td.paths_removed ? `${td.paths_removed} file path(s) removed` : '',
  ].filter(Boolean).join(', ') || 'whitespace only']]));
  if (debug && td.before) b.appendChild(lazy(ui, 'tidy', 'The answer before tidying', () => pre(td.before, true)));
}

function debugSection(data, ui) {

  const res = data.result || {};
  const pr = data.prompt || {};
  sec.appendChild(kv([
    ['Conversation', el('span', 'mono', data.thread || '')],
    ['Session', pr.resume ? 'resumed (follow-up)' : 'new'],

    ['Model', data.model], ['Claude Code', data.claude_version], ['Permission mode', data.permission_mode],
    ['Model turns', res.num_turns], ['API time', res.duration_api_ms != null ? fmtMs(res.duration_api_ms) + (data.followup ? ' (whole conversation)' : '') : null],
    ['Ended because', [res.stop_reason, res.terminal_reason].filter(Boolean).join(' / ')],
    ['Exit code', data.rc],
  ]));
  const add = (key, title, make) => sec.appendChild(lazy(ui, key, title, make));
  add('prompt', 'Prompt sent to the model (question and dataset description)', () => pre(pr.text || '', true));
  add('system', 'System prompt', () => pre(pr.system || '', true));
  add('cmd', 'Claude Code command', () => pre((data.command || []).join(' '), true));
  if (res.usage) add('usage', 'Token usage for this answer', () => pre(json(res.usage)));
  if (res.model_usage) add('musage', 'Per-model usage and cost (whole conversation)', () => pre(json(res.model_usage)));
  if (data.rate_limit) add('rate', 'Rate limit status', () => pre(json(data.rate_limit)));
  if (data.stderr) add('stderr', 'Claude Code stderr', () => pre(data.stderr, true));
  if (data.trace_errors && data.trace_errors.length) add('terr', `Tracing problems (${data.trace_errors.length})`, () => pre(data.trace_errors.join('\n'), true));
  const raw = data.raw || [];
  const skipped = Object.entries(data.raw_skipped || {}).map(([k, v]) => `${num(v)} ${k}`).join(', ');
  add('raw', `Raw stream from Claude Code (${raw.length} events${skipped ? '; not kept: ' + skipped : ''})`, () => {
    const lines = raw.map(r => `[${fmtAt(r.t)}] ${r.type || ''}${r.subtype ? '/' + r.subtype : ''}  ` +
      (r.event ? JSON.stringify(r.event) : r.clipped || ''));
    return pre(lines.join('\n'), true);
  });
  return sec;
}

// Keep the clock moving on an answer that is still coming.
setInterval(() => {
  Object.values(LIVE).forEach(l => { if (!l.tail && l.turn.pending) repaintTrace(l.turn); });
}, 1000);

// --- start ---------------------------------------------------------------------------
// The model that answers, when the server lists more than one (CHIRON_MCP_ASK_MODELS).
// The choice is kept per browser; a follow-up may use a different model than the question
// before it, and the trace under each answer names the model that actually answered.
let MODEL = '';
function setupModels(d) {
  const sel = $('model'), list = (d && d.models) || [];
  if (list.length < 2) { sel.hidden = true; MODEL = ''; return; }
  let saved = '';
  try { saved = localStorage.getItem('chiron-ask:model') || ''; } catch (_) {}
  MODEL = list.some(m => m.id === saved) ? saved : (d.model || list[0].id);
  sel.textContent = '';
  list.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.label; sel.appendChild(o); });
  sel.value = MODEL;
  sel.hidden = false;
  sel.onchange = () => { MODEL = sel.value; try { localStorage.setItem('chiron-ask:model', MODEL); } catch (_) {} };
}

// The top bar says who Ask answers as and what they may see of this dataset, in the
// words Chiron's own access levels use. The server resolves both the same way the tools
// do, so this is a statement of what the answers obey, not a label the page chose.
const ACCESS = { phi: 'full access', deid: 'de-identified', agg: 'aggregate only' };
let EMBEDDED = false;
try { EMBEDDED = window.self !== window.top; } catch (_) { EMBEDDED = true; }
function renderWho(d, match) {
  const box = $('who'), name = $('who-name'), level = $('who-level');
  box.hidden = false;
  if (!ME) {
    box.classList.add('out');
    name.textContent = 'Not signed in';
    level.textContent = '';
    box.title = (d && d.error) || 'Log in to Chiron first; Ask answers as the person logged in.';
    return;
  }
  const u = (d && d.user) || {};
  box.classList.remove('out');
  const lv = match && match.access_level;
  const levelText = lv ? (ACCESS[lv] || lv) + ' · ' + DATASET_NAME
                       : (DATASET ? 'no access to ' + DATASET_NAME : '');
  if (EMBEDDED) {
    // Inside the Chiron UI the name, the dataset and the access level are already on
    // Chiron's own pages, so the box only ever shows the "not signed in" warning there.
    box.hidden = true;
    return;
  }
  name.textContent = u.name || u.username || ME;
  level.textContent = levelText;
  box.title = 'Signed in to Chiron as ' + (u.name || ME) + (u.email ? ' (' + u.email + ')' : '')
    + (lv ? '. On ' + DATASET_NAME + ': ' + (ACCESS[lv] || lv) + '.' : '');
}

// The sidebar's foot: everyone sees their own total (questions asked, what they cost);
// the link to the usage page is there only for those who may see everyone's.
function renderUsageLink(d) {
  $('usage-link').hidden = !(ME && d && d.usage && d.usage.everyone);
}
let myUsageTimer = null;
let MY_USAGE = null;   // { n, cost, at }: the person's own total, as last read or bumped
function paintMyUsage() {
  const box = $('my-usage');
  if (!ME || !MY_USAGE) { box.hidden = true; return; }
  const { n, cost } = MY_USAGE;
  box.textContent = n ? n + (n === 1 ? ' question' : ' questions') + ' · $'
                        + (cost >= 0.01 || cost === 0 ? cost.toFixed(2) : cost.toFixed(3))
                      : 'No questions yet';
  box.title = 'Your own total, all time: ' + n + (n === 1 ? ' question' : ' questions') + ', $' + cost.toFixed(4)
    + (MY_USAGE.at ? ' (updated ' + new Date(MY_USAGE.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ')' : '');
  box.hidden = false;
}
async function loadMyUsage() {
  if (!ME) { paintMyUsage(); return; }
  let d = null;
  try { d = await fetch('usage.json?period=all&recent=0&user=' + encodeURIComponent(ME), { cache: 'no-store' }).then(r => r.json()); }
  catch (_) { d = null; }
  const t = d && !d.error && d.totals;
  if (!t || t.answers == null) return;   // keep what is shown rather than blank it
  MY_USAGE = { n: Number(t.answers) || 0, cost: Number(t.cost_usd) || 0, at: Date.now() };
  paintMyUsage();
}
// The moment an answer ends its cost is added here; the ledger is re-read right after,
// so the figure never waits for a reload and never drifts from the ledger.
function bumpMyUsage(cost) {
  if (!MY_USAGE) return;
  MY_USAGE = { n: MY_USAGE.n + 1, cost: MY_USAGE.cost + (Number(cost) || 0), at: Date.now() };
  paintMyUsage();
}
function refreshMyUsage() { clearTimeout(myUsageTimer); myUsageTimer = setTimeout(loadMyUsage, 1500); }

// Who is asking decides whose conversations to show, so nothing renders until then.
function start(d) {
  ME = (d && d.identity) || null;
  setupModels(d);
  const match = d && (d.datasets || []).find(x => x.id === DATASET);
  DATASET_NAME = (match && match.name) || DATASET || 'this dataset';
  DATASET_LEVEL = (match && match.access_level) || '';
  renderWho(d, match);
  renderUsageLink(d);
  loadMyUsage();
  POOL = (d && d.pool) || [];
  FEATURES = (d && d.features) || {};
  WHO = (d && d.user) || null;
  SHARE_RULE = (d && d.share_rule) || SHARE_RULE;
  if (VIEW_THREAD) { enterView(); return; }
  loadLibrary();
  load();
  pickStarters();
  renderSidebar();
  renderThread();
  updateComposer();
  syncThreads().then(() => { const c = activeChat(); if (c && c.thread && c.turns.length) refreshTurns(c); });
}
// One conversation, read-only, by itself: the printable copy behind Export PDF, and the
// page a shared link opens. Nothing of it is kept in this browser.
function enterView() {
  document.body.classList.add('view-mode');
  const chat = { id: 'view:' + VIEW_THREAD, thread: VIEW_THREAD, title: 'Conversation', turns: [], view: true,
                 readonly: true, updated: Date.now(), created: Date.now() };
  SHARED = [chat];
  activeId = chat.id;
  renderThread();
  updateComposer();
}
function printWhenDrawn() {
  // Charts draw after the text is in place; print once they have.
  if (printWhenDrawn.done) return;
  printWhenDrawn.done = true;
  setTimeout(() => { try { window.focus(); window.print(); } catch (_) {} }, 1500);
}
// Right after a fresh sign-on, the first requests can run before Chiron has set its
// session cookie (its sign-on middleware does that on the first Chiron request), so a
// page that finds nobody logged in shows itself and asks again, a few times, rather
// than settling for an empty sidebar until someone reloads.
let BOOT_TRIES = 0;
function boot() {
  fetch('datasets?dataset=' + encodeURIComponent(DATASET), { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      if (!(d && d.identity) && BOOT_TRIES < 4) {
        BOOT_TRIES += 1;
        if (BOOT_TRIES === 1) start(d);
        setTimeout(boot, 1500 * BOOT_TRIES);
        return;
      }
      start(d);
    })
    .catch(() => {
      if (BOOT_TRIES < 4) { BOOT_TRIES += 1; if (BOOT_TRIES === 1) start(null); setTimeout(boot, 1500 * BOOT_TRIES); }
      else start(null);
    });
}
boot();
</script>
</body>
</html>
