<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Chiron</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --accent: #00796b; --accent-strong: #00574d; --accent-soft: #e3f2ef; --accent-line: #b8ddd6;
    --brand: #4a148c;
    --ink: #1d2328; --ink-2: #3c464f; --muted: #6b7780; --faint: #98a2ab;
    --line: #e3e7ea; --line-2: #eef1f3;
    --panel: #f7f8f9; --bg: #ffffff;
    --danger: #b3261e; --danger-bg: #fdf0ef; --danger-line: #f3c9c5;
    --radius: 12px;
    --font: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(16, 24, 32, .06), 0 4px 16px rgba(16, 24, 32, .06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.6;
    display: flex; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------------------------------------------------------------- sidebar */
  .sidebar {
    width: 272px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .side-head { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
  .new-chat {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    transition: border-color .15s, background .15s;
  }
  .new-chat:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .search { display: block; position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: 13px; padding: 7px 10px 7px 32px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink);
  }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }

  .chats { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
  .side-foot {
    padding: 8px 14px 12px; border-top: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .side-foot .mine { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .side-foot a {
    font-size: 12.5px; color: var(--muted); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .side-foot a:hover { color: var(--ink); }
  .group-label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--faint); padding: 14px 8px 6px;
  }
  .chat-item {
    position: relative; display: flex; align-items: center; gap: 8px;
    border-radius: 9px; margin: 1px 0;
  }
  .chat-item > button.open {
    flex: 1; min-width: 0; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 8px 34px 8px 10px; border-radius: 9px; color: var(--ink-2);
  }
  .chat-item .title {
    display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: clip;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  }
  .chat-item .meta { display: block; font-size: 11.5px; color: var(--faint); }
  .chat-item.expired .title { color: var(--muted); }
  .chat-item.expired .meta { color: var(--warn, #8a5300); }
  .chat-item:hover > button.open { background: #eceff1; }
  .chat-item.active > button.open { background: var(--accent-soft); color: var(--ink); }
  .chat-item.active .title { font-weight: 500; }
  .chat-item .del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 7px; border: 0; background: none; cursor: pointer;
    color: var(--faint); display: grid; place-items: center; opacity: 0; transition: opacity .12s;
  }
  .chat-item:hover .del, .chat-item.active .del, .chat-item .del:focus-visible { opacity: 1; }
  .chat-item .del:hover { background: #e2e6e9; color: var(--danger); }
  .chat-item .live {
    position: absolute; right: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite;
  }
  .confirm {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 7px 8px 7px 10px; border-radius: 9px; background: var(--danger-bg);
    font-size: 12.5px; color: var(--danger);
  }
  .confirm span { flex: 1; }
  .confirm button {
    border: 1px solid var(--danger-line); background: #fff; color: var(--danger);
    font-size: 12px; padding: 3px 9px; border-radius: 7px; cursor: pointer;
  }
  .confirm button.yes { background: var(--danger); color: #fff; border-color: var(--danger); }
  .no-chats { font-size: 13px; color: var(--muted); padding: 18px 10px; line-height: 1.5; }


  /* ------------------------------------------------------------ main pane */
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .topbar {
    height: 52px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 20px; border-bottom: 1px solid var(--line-2); background: var(--bg);
  }
  .topbar h1 {
    margin: 0; font-size: 15px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center; color: var(--ink-2); flex: none;
  }
  .icon-btn:hover { background: var(--panel); }
  .menu-btn { display: none; }
  /* Share and Export, for the open conversation */
  .top-tools { display: flex; gap: 6px; margin-left: auto; flex: none; position: relative; }
  .top-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  .top-btn:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); }
  .top-btn[aria-expanded="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
  .popover {
    position: absolute; top: 40px; right: 0; z-index: 30; width: 320px; max-width: calc(100vw - 32px);
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 14px; font-size: 13px;
  }
  .popover h3 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; }
  .popover p { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .popover .rules { margin: 10px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line-2); color: var(--muted); font-size: 11.5px; line-height: 1.5; }
  .popover .rules b { font-weight: 600; color: var(--ink-2); }
  .popover .row { display: flex; gap: 6px; }
  .popover input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  }
  .popover .people { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .popover .people li { display: flex; align-items: center; gap: 8px; }
  .popover .people li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .popover .people li small { color: var(--muted); }
  .popover .msg { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .popover .msg.bad { color: var(--danger); }
  .banner {
    max-width: 800px; margin: 0 auto; padding: 10px 24px 0; font-size: 13px; color: var(--ink-2);
  }
  .banner > div {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline;
  }
  .banner b { font-weight: 600; }
  .withheld { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
  .by-line { font-size: 11.5px; color: var(--muted); text-align: right; margin-bottom: -10px; }
  .by-line.copied { text-align: left; }
  .popover label.cont { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .popover label.cont input { margin: 0; }
  /* reporting an answer */
  .feedback { font-size: 12px; color: var(--faint); }
  .flag-form {
    margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel);
    font-size: 13px; display: flex; flex-direction: column; gap: 8px; max-width: 560px;
  }
  .flag-form .kinds { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .flag-form label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .flag-form textarea {
    font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
    resize: vertical; min-height: 40px; background: var(--bg); color: var(--ink);
  }
  .flag-form small { color: var(--muted); font-size: 11.5px; }
  .flag-form .row { display: flex; gap: 6px; align-items: center; }
  .chat-item .meta .by { color: var(--accent-strong); }
  /* read-only view of one conversation (Export PDF, shared links) */
  body.view-mode .sidebar, body.view-mode .composer-wrap, body.view-mode .menu-btn,
  body.view-mode .top-tools, body.view-mode .to-bottom, body.view-mode .feedback, body.view-mode .followups { display: none !important; }
  body.view-mode .topbar h1 { font-size: 16px; }
  @media print {
    html, body { height: auto; overflow: visible; display: block; background: #fff; }
    .sidebar, .composer-wrap, .menu-btn, .top-tools, .to-bottom, .feedback, .followups, .actions,
    .trace-slot, .scrim, .who { display: none !important; }
    .pane { display: block; }
    main { overflow: visible; }
    .thread { max-width: none; padding: 12px 0; gap: 22px; }
    .topbar { height: auto; border: 0; padding: 0 0 8px; }
    .msg.user .bubble { background: #eee; color: #000; max-width: none; border-radius: 8px; }
    .ac, .table-wrap, .turn { break-inside: avoid; }
    .ac-tools, .ac-tip, .ac-plain, .ar-btns { display: none !important; }
    .ar { break-inside: avoid; }
    .banner { padding: 0 0 10px; }
    .banner > div { background: none; border: 0; padding: 0; }
  }

  main { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 800px; margin: 0 auto; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 36px; }
  .turn { display: flex; flex-direction: column; gap: 18px; }

  /* empty state */
  .hero { text-align: center; padding: 8vh 0 0; }
  .hero h2 { margin: 0 0 6px; font-size: 22px; font-weight: 500; color: var(--ink); letter-spacing: -.01em; }
  .hero p { margin: 0 auto; max-width: 520px; color: var(--muted); font-size: 14.5px; }
  .caps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px 0 26px; }
  .cap {
    font-size: 12px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line);
    padding: 3px 10px; border-radius: 999px;
  }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
  .card {
    border: 1px solid var(--line); background: var(--bg); border-radius: var(--radius);
    padding: 12px 14px; cursor: pointer; font-size: 14px; color: var(--ink-2); line-height: 1.45;
    transition: border-color .15s, box-shadow .15s, transform .15s; text-align: left;
  }
  .card:hover { border-color: var(--accent-line); box-shadow: var(--shadow); transform: translateY(-1px); }
  .card small { display: block; color: var(--accent-strong); font-size: 11px; font-weight: 600;
                letter-spacing: .03em; text-transform: uppercase; margin-bottom: 3px; }

  /* messages */
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--accent); color: #fff; padding: 10px 15px; border-radius: 18px 18px 4px 18px;
    max-width: 78%; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.bot .body { min-width: 0; }

  .steps { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 3px; }
  .step {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--line); padding: 3px 11px 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .step::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-line); }
  .step.working::before { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }

  .answer h1, .answer h2, .answer h3 { font-size: 1.05rem; margin: 18px 0 6px; font-weight: 600; }
  .answer p { margin: 0 0 10px; }
  .answer > :last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
  .answer li { margin-bottom: 4px; }
  .answer strong { font-weight: 600; }
  .answer a { color: var(--accent-strong); }
  .answer code {
    font-family: var(--mono); font-size: .86em; background: var(--panel);
    border: 1px solid var(--line-2); padding: 1px 5px; border-radius: 5px;
  }
  .answer pre {
    background: var(--panel); border: 1px solid var(--line); padding: 12px 14px;
    border-radius: 10px; overflow-x: auto;
  }
  .answer pre code { background: none; border: 0; padding: 0; }

  .table-wrap {
    overflow-x: auto; margin: 2px 0 12px; border: 1px solid var(--line); border-radius: 10px;
  }
  .answer table { border-collapse: collapse; font-size: 14px; width: 100%; min-width: 320px; }
  .answer th {
    text-align: left; background: var(--panel); color: var(--ink-2); font-weight: 600;
    font-size: 12.5px; padding: 9px 14px; white-space: nowrap; border-bottom: 1px solid var(--line);
  }
  .answer td {
    padding: 8px 14px; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums;
  }
  .answer tbody tr:last-child td { border-bottom: 0; }
  .answer tbody tr:hover td { background: #fafbfb; }

  /* a chart (see Charts): title, subtitle and buttons, a legend for several series, the chart or its table */
  .ac { margin: 2px 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .ac [hidden] { display: none !important; }
  .ac-head { display: flex; align-items: flex-start; gap: 10px; padding: 13px 12px 0 18px; }
  .ac-titles { flex: 1; min-width: 0; }
  .ac-title { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
  .ac-sub { font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 1px; overflow-wrap: anywhere; }
  .ac-tools { display: flex; gap: 2px; flex: none; }
  .ac-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid transparent;
    border-radius: 8px; background: none; color: var(--muted); font-size: 12.5px; font-weight: 500; cursor: pointer;
  }
  .ac-btn:hover { background: var(--panel); color: var(--ink); border-color: var(--line); }
  .ac-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ac-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent-line); }
  .ac-btn.busy { opacity: .55; cursor: progress; }
  .ac-narrow .ac-btn { padding: 0 7px; }
  .ac-narrow .ac-btn span { display: none; }
  .ac-legend { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 8px 18px 0; }
  .ac-key {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2);
    background: none; border: 0; padding: 2px 0; cursor: pointer; text-align: left;
  }
  .ac-key i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .ac-key.line i { width: 14px; height: 3px; }
  .ac-key[aria-pressed="false"] { color: var(--faint); text-decoration: line-through; }
  .ac-key[aria-pressed="false"] i { opacity: .3; }
  .ac-plot { padding: 8px 14px 12px 8px; }
  .ac-wrap { position: relative; }
  .ac-tip {
    position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 7px 11px 8px; font-size: 12.5px; line-height: 1.5; min-width: 110px; max-width: 280px;
  }
  .ac-tip .tx { color: var(--muted); font-size: 12px; line-height: 1.35; margin-bottom: 3px; overflow-wrap: anywhere; }
  .ac-tip .tr { display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
  .ac-tip .tr i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
  .ac-tip .tr b { font-weight: 600; color: var(--ink); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .ac-tip .tr span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .ac-note { padding: 10px 18px 16px; font-size: 13.5px; color: var(--muted); }
  .ac-table { padding: 8px 14px 14px; max-height: 380px; overflow: auto; }
  .ac-table th { position: sticky; top: 0; z-index: 1; }
  .ac-strip { display: flex; gap: 2px; height: 26px; margin: 12px 18px 0; }
  .ac-strip span {
    flex: 1 1 0; min-width: 2px; display: flex; align-items: center; overflow: hidden; white-space: nowrap;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .ac-strip span:first-child { border-radius: 6px 0 0 6px; }
  .ac-strip span:last-child { border-radius: 0 6px 6px 0; }
  .ac-strip span:only-child { border-radius: 6px; }
  .ac-plain { padding: 9px 18px 13px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-2); }
  .ac-link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent-strong); text-decoration: underline; cursor: pointer; }
  .ac-table .n { text-align: right; }
  /* a report (see Reports): the first page in miniature, the title, the buttons */
  .ar {
    display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "thumb title" "thumb btns" ". err";
    column-gap: 16px; align-items: center; margin: 2px 0 12px; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 16px 12px 12px; background: #fff;
  }
  .ar-thumb {
    grid-area: thumb; width: 82px; height: 106px; overflow: hidden; border-radius: 3px; background: #fff;
    border: 1px solid #dfe4e7; box-shadow: 0 1px 2px rgba(16, 24, 32, .06), 0 3px 10px rgba(16, 24, 32, .08);
  }
  .ar-thumb .ar-pg { transform: scale(.134); transform-origin: 0 0; }
  .ar-title { grid-area: title; align-self: end; margin-bottom: 10px; font-size: 16.5px; font-weight: 600; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
  .ar-btns { grid-area: btns; align-self: start; display: flex; flex-wrap: wrap; gap: 8px; }
  .ar-btns svg { flex: none; }
  .ar-busy .ar-btns button { cursor: progress; }
  .ar-err { grid-area: err; margin-top: 8px; font-size: 13px; color: var(--danger); }
  .ar-bad { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .ar-icon { color: var(--faint); display: flex; }
  .ar-note { font-size: 13.5px; color: var(--muted); }
  .ar [hidden] { display: none !important; }
  /* the page itself, at its PDF size (Letter, 612 x 792), scaled down in .ar-thumb */
  .ar-pg { width: 612px; height: 792px; padding: 50px 44px 54px; position: relative; background: #fff; color: #1d2328; font-family: var(--font); line-height: 1.35; }
  .ar-pg-body { height: 688px; overflow: hidden; }
  .ar-pg-t { font-size: 22px; font-weight: 700; line-height: 1.2; margin-bottom: 5px; }
  .ar-pg-m { font-size: 9px; color: #6b7780; margin-bottom: 16px; }
  .ar-pg-short { background: #f7f8f9; border-left: 3px solid #00897b; padding: 7px 10px; font-size: 10.5px; color: #3c464f; margin-bottom: 14px; }
  .ar-pg-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .ar-pg-tiles div { border: 1px solid #e3e7ea; padding: 7px 8px 8px; }
  .ar-pg-tiles b { display: block; font-size: 19px; }
  .ar-pg-tiles span { display: block; font-size: 8.5px; color: #6b7780; }
  .ar-pg-h { font-size: 13.5px; font-weight: 700; margin: 12px 0 4px; }
  .ar-pg-h i { font-style: normal; color: #00897b; margin-right: 9px; }

  .ar-pg-table div { height: 17px; border-bottom: 1px solid #eef1f3; }
  .ar-pg-table div:nth-child(odd) { background: #f7f8f9; }
  .ar-pg-table .hd { height: 18px; background: #00897b !important; border: 0; }
  .ar-pg-call { display: flex; align-items: center; gap: 14px; background: #f6effa; border: 1px solid #d7c3e6; padding: 6px 12px; margin: 4px 0 14px; }
  .ar-pg-call b { font-size: 22px; color: #7b1fa2; }
  .ar-pg-call span { font-size: 10px; color: #3c464f; }

  @media (max-width: 560px) {
    .ar { grid-template-columns: 58px minmax(0, 1fr); grid-template-areas: "thumb title" "btns btns" "err err"; column-gap: 12px; padding: 12px; }
    .ar-thumb { width: 58px; height: 75px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chiron-link {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--accent); color: #fff; text-decoration: none; border: 1px solid var(--accent);
    padding: 7px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .chiron-link:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .chiron-link.load { background: #fff; color: var(--accent-strong); border-color: var(--accent-line); }
  .chiron-link.load:hover { background: var(--accent-soft); }
  .chiron-link:disabled { opacity: .6; cursor: default; }
  .chiron-link.gone { background: var(--panel); color: var(--faint); border-color: var(--line); cursor: default; }

  .note { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
  .followups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .followup {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-align: left;
    font-size: 13.5px; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 999px; line-height: 1.35;
    transition: border-color .15s, background .15s, color .15s;
  }
  .followup::before { content: "\21B3"; color: var(--accent); font-size: 13px; }
  .followup:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); }
  .err {
    background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-line);
    padding: 10px 14px; border-radius: 10px; font-size: 14px;
  }

  .to-bottom {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px;
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; box-shadow: var(--shadow); cursor: pointer; color: var(--ink-2);
    display: grid; place-items: center;
  }

  /* composer */
  .composer-wrap { flex: none; padding: 8px 24px 18px; background: var(--bg); }
  .composer {
    max-width: 752px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 8px 8px 8px 16px; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .composer textarea {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; line-height: 1.5;
    border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    padding: 7px 0; margin: 0; max-height: 200px; min-height: 22px;
  }
  .composer textarea:focus-visible { outline: 0; }
  .send {
    width: 36px; height: 36px; flex: none; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    transition: background .15s, opacity .15s;
  }
  .send:hover { background: var(--accent-strong); }
  .send:disabled { background: #cfd6db; cursor: default; }
  .send.stop { background: var(--ink, #1f2a30); }
  .send.stop:hover { background: #000; }
  /* the model that answers, when the server offers a choice */
  .model {
    flex: none; align-self: center; font: inherit; font-size: 12px; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 6px; max-width: 130px; cursor: pointer;
  }
  .model:hover { color: var(--ink); }
  .model:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 1px; }

  /* the question library: the Questions button in the top bar (beside Share and Export
     PDF), the panel it opens, the new chat page's groups, and Save question under an answer */
  .lib-pop {
    position: absolute; top: 58px; right: 16px; z-index: 30;
    width: min(880px, calc(100% - 32px)); height: min(640px, calc(100% - 140px)); min-height: 300px;
    display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 16px 48px rgba(16, 24, 32, .2); overflow: hidden;
  }
  .lib-top { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px 16px; }
  .lib-top h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-top h3 small { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 8px; }
  .lib-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
  .lib-tabs button { border: 0; background: none; padding: 5px 12px; font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .lib-tabs button + button { border-left: 1px solid var(--line); }
  .lib-tabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
  .lib-x { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: var(--muted); display: grid; place-items: center; flex: none; }
  .lib-x:hover { background: var(--panel); color: var(--ink); }
  .lib-search { padding: 0 16px 12px; border-bottom: 1px solid var(--line-2); }
  .lib-find {
    width: 100%; font: inherit; font-size: 13.5px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
  }
  .lib-main { flex: 1; min-height: 0; display: flex; }
  .lib-nav { width: 214px; flex: none; overflow-y: auto; padding: 10px 8px; background: var(--panel); border-right: 1px solid var(--line-2); }
  .lib-nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left; font: inherit; font-size: 13px;
    color: var(--ink-2); padding: 7px 10px; border-radius: 8px;
  }
  .lib-nav button:hover { background: #eceff1; }
  .lib-nav button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
  .lib-nav .n { font-size: 11.5px; color: var(--faint); font-weight: 400; }
  .lib-list { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 16px 18px; }
  .lib-sec { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 2px 2px 8px; }
  .lib-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
  .lib-card {
    border: 1px solid var(--line); border-radius: 11px; background: var(--bg); display: flex; flex-direction: column;
    min-width: 0; transition: border-color .15s, box-shadow .15s;
  }
  .lib-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
  .lib-card > button.pick {
    flex: 1; display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 10px 12px; font: inherit; color: var(--ink); border-radius: 11px;
  }
  .lib-card > button.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lib-card .nm { display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 2px; }
  .lib-card .tx { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
  .lib-card .mt { display: block; font-size: 11.5px; color: var(--faint); margin-top: 6px; }
  .lib-card .mt .ok { color: var(--pass); }
  .lib-card .mt.review { color: var(--warn); }
  .lib-acts, .lib-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 12px 10px; }
  .lib-confirm span { font-size: 12.5px; color: var(--danger); }
  .lib-edit { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--panel); border-radius: 11px; grid-column: 1 / -1; }
  .lib-edit input, .lib-edit textarea, .save-form input[type=text], .save-form textarea {
    font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
    background: var(--bg); color: var(--ink); resize: vertical; width: 100%;
  }
  .lib-edit .row { display: flex; gap: 6px; align-items: center; }
  .lib-msg { font-size: 12px; color: var(--danger); }
  .lib-empty { padding: 18px 4px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .lib-foot { display: flex; align-items: center; gap: 14px; padding: 9px 16px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line-2); }
  .lib-foot span { flex: 1; }
  .lib-foot.err span { color: var(--danger); }
  .lib-foot a { color: var(--accent-strong); text-decoration: none; white-space: nowrap; }
  .lib-foot a:hover { text-decoration: underline; }
  @media (max-width: 760px) {
    .lib-nav { display: none; }
    .lib-grid { grid-template-columns: 1fr; }
    .lib-pop { right: 8px; width: calc(100% - 16px); }
  }
  .lib-label {
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
    text-align: left; margin: 18px 0 8px;
  }
  .caps + .lib-label { margin-top: 0; }
  .card small.ok { color: var(--pass); }
  .save-form label.field { display: flex; flex-direction: column; align-items: stretch; gap: 3px; cursor: default; }
  .save-form label.field small { color: var(--muted); font-size: 11.5px; }
  .save-form .admin-box {
    border: 1px solid var(--accent-line); background: var(--bg); border-radius: 9px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .save-form .admin-box .who-tag { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-strong); }
  .save-form .admin-box label { align-items: flex-start; }
  .save-form .admin-box label.field { padding-left: 21px; max-width: 360px; }
  .save-form .admin-box input[type=checkbox] { margin: 3px 0 0; accent-color: var(--accent); }
  .save-form .exp { font-size: 12.5px; color: var(--ink-2); padding-left: 21px; }
  .warnbox {
    background: var(--warn-bg); border: 1px solid #f0dc9c; color: var(--warn); border-radius: 9px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.45;
  }
  .scrim { display: none; }

  /* ---------------------------------------------------------------- trace */
  :root {
    --k-request: #455a64; --k-startup: #8a97a1; --k-model: #7b1fa2; --k-tool: #00796b;
    --k-post: #1976d2; --k-retry: #f57c00; --k-note: #98a2ab; --k-error: #b3261e;
    --warn: #8a5300; --warn-bg: #fff4e2; --info: #1a5aa6; --info-bg: #eef4fb;
    --pass: #2e7d32; --pass-bg: #edf7ee; --tl-label: 230px;
  }
  /* who is signed in, and what they may see here. Inside the Chiron UI the person's
     name is already in Chiron's own header, so only the access level shows there. */
  .top-tools[hidden] + .who { margin-left: auto; }   /* no conversation open: the name alone keeps the right */
  .who {
    margin-left: 12px; display: flex; flex-direction: column; align-items: flex-end; flex: none; min-width: 0;
    line-height: 1.25; text-align: right; cursor: default;
  }
  .who b {
    font-weight: 500; font-size: 13px; color: var(--ink); max-width: 240px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who small { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .who.out b { color: var(--danger); }

  .trace-slot { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .trace-slot:empty { display: none; }
  .trace-slot > .trace, .trace-slot > .flag-form { flex: 1 1 100%; }
  .trace-slot > .flag-form { max-width: none; }   /* the open report form takes its own line */
  .trace-bar {
    display: inline-flex; align-items: center; flex-wrap: wrap; gap: 7px; cursor: pointer;
    font-size: 12.5px; color: var(--muted); background: none; border: 1px solid var(--line-2);
    padding: 4px 10px 4px 8px; border-radius: 8px; text-align: left;
  }
  .trace-bar:hover, .trace-bar[aria-expanded="true"] { border-color: var(--line); color: var(--ink-2); background: var(--panel); }
  .trace-bar .chev { transition: transform .15s; }
  .trace-bar[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .badge { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; line-height: 18px; white-space: nowrap; }
  .badge.fail { background: var(--danger-bg); color: var(--danger); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.pass { background: var(--pass-bg); color: var(--pass); }

  .trace {
    margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
    font-size: 13px; line-height: 1.5; overflow: hidden;
  }
  .tr-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 9px 12px;
    border-bottom: 1px solid var(--line-2); background: var(--panel);
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); flex: none; }
  .seg button { border: 0; background: none; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .tr-meta { flex: 1; min-width: 180px; color: var(--muted); font-size: 12px; }
  .tr-tools { display: flex; gap: 6px; flex: none; }
  .mini-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); font-size: 12px;
    padding: 3px 9px; border-radius: 7px; cursor: pointer;
  }
  .mini-btn:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .mini-btn:disabled { opacity: .5; cursor: default; }
  .tr-sec { padding: 10px 12px; border-bottom: 1px solid var(--line-2); min-width: 0; }
  .tr-sec:last-child { border-bottom: 0; }
  .tr-sec > h4 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--faint);
  }
  .tr-msg { color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 5px 9px; min-width: 0; }
  .stat b { display: block; font-size: 14px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .split { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: var(--line-2); }
  .split i { display: block; height: 100%; }

  .checks { display: flex; flex-direction: column; gap: 5px; }
  .check { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: start; padding: 6px 9px; border-radius: 8px; }
  .check.fail { background: var(--danger-bg); } .check.warn { background: var(--warn-bg); }
  .check.info { background: var(--info-bg); } .check.pass { background: var(--pass-bg); }
  .check .ic { font-weight: 700; text-align: center; line-height: 1.5; }
  .check.fail .ic { color: var(--danger); } .check.warn .ic { color: var(--warn); }
  .check.info .ic { color: var(--info); } .check.pass .ic { color: var(--pass); }
  .check .t { color: var(--ink); word-break: break-word; }
  .check .d { color: var(--ink-2); font-size: 12px; opacity: .85; }
  /* "What happened": the calls behind an answer, in words */
  .what-list { display: flex; flex-direction: column; gap: 6px; }
  .what-call { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; line-height: 1.4; }
  .what-call b { font-weight: 600; }
  .what-call.err b { color: var(--danger); }
  .what-call .builds { flex-basis: 100%; }
  .builds { color: var(--k-post); font-size: 12px; }
  small.builds { display: block; }
  .link-btn {
    border: 0; background: none; color: var(--accent-strong); cursor: pointer; font-size: 12px;
    padding: 0; white-space: nowrap; text-decoration: underline; text-underline-offset: 2px;
  }

  .tl-axis, .tl-row { display: grid; grid-template-columns: var(--tl-label) minmax(0, 1fr); }
  .tl-ticks { position: relative; height: 18px; font-size: 10.5px; color: var(--faint); border-bottom: 1px solid var(--line-2); }
  .tl-ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .tl-ticks span:first-child { transform: none; }
  .tl-row { align-items: center; min-height: 24px; cursor: pointer; border-radius: 6px; }
  .tl-row:hover { background: var(--panel); }
  .tl-row.sel { background: var(--accent-soft); }
  .tl-name { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 8px 0 4px; font-size: 12px; color: var(--ink-2); }
  .tl-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-name.sub { padding-left: 18px; }
  .tl-row.error .tl-name { color: var(--danger); }
  .kdot { flex: none; width: 8px; height: 8px; border-radius: 2px; }
  .tl-track { position: relative; height: 24px; }
  .tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
  .tl-bar { position: absolute; top: 6px; height: 12px; border-radius: 3px; min-width: 3px; }
  .tl-bar.running {
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 5px, transparent 5px 10px);
    background-size: 14px 14px; animation: crawl .8s linear infinite;
  }
  @keyframes crawl { to { background-position: 14px 0; } }
  .tl-mark { position: absolute; top: 5px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); border-radius: 2px; }
  .tl-dur { position: absolute; top: 4px; font-size: 10.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .story { display: flex; flex-direction: column; gap: 6px; }
  .st { border: 1px solid var(--line-2); border-radius: 9px; min-width: 0; }
  .st.sel { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-soft); }
  .st-h { display: grid; grid-template-columns: 54px 10px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 10px; cursor: pointer; }
  .st-h:hover { background: #fafbfb; border-radius: 9px; }
  .st-t { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .st-h .kdot { align-self: center; }
  .st-l { color: var(--ink); min-width: 0; font-weight: 500; word-break: break-word; }
  .st-l small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .st.error .st-l small, .st.error .st-l { color: var(--danger); }
  .st.warn .st-l small { color: var(--warn); }
  .st-d { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st-b { padding: 2px 12px 10px 82px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .lbl { font-size: 10.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 0; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--ink); word-break: break-word; }
  .kv dd.warn { color: var(--warn); }
  .think {
    border-left: 3px solid var(--k-model); background: #f8f4fb; padding: 6px 10px;
    border-radius: 0 7px 7px 0; white-space: pre-wrap; color: var(--ink-2); word-break: break-word;
  }
  .said { border-left: 3px solid var(--line); padding: 3px 10px; white-space: pre-wrap; color: var(--ink-2); word-break: break-word; }

  .chip.no { text-decoration: line-through; color: var(--faint); }
  ul.cd { margin: 0; padding-left: 18px; color: var(--ink-2); }

  pre.json {
    margin: 4px 0 0; max-height: 340px; overflow: auto; font-family: var(--mono); font-size: 11.5px;
    line-height: 1.45; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px;

  .ok-t { color: var(--pass); } .no-t { color: var(--warn); }

  /* ------------------------------------------------------------- narrow */
  @media (max-width: 760px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: 84vw; max-width: 300px;
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow);

</style>
</head>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>

<script>
// ---------------------------------------------------------------------------------
// Ask Chiron. Every call to the server is a relative URL, so the page works at the Ask
// server's own root (http://localhost:8900/) and behind a proxy at a prefix (/ask/).
// ---------------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const threadEl = $('thread'), scroller = $('scroller'), qBox = $('q'), sendBtn = $('send');
const chatsEl = $('chats'), searchBox = $('search');

// The dataset is fixed by the route that embedded this page (/<dataset>/ask).
const PARAMS = new URLSearchParams(location.search);
const DATASET = PARAMS.get('dataset') || '';
// ?view=<conversation> shows one conversation read-only (Export PDF opens it in a new
// tab; a conversation shared by a colleague opens the same way); &print=1 prints it.
const VIEW_THREAD = PARAMS.get('view') || '';
const PRINT = PARAMS.get('print') === '1';

// What each Chiron tool call means to someone waiting for an answer.
const STEP_LABELS = {
  query: 'Asking Chiron', datasets: 'Checking access', find_concepts: 'Finding variables',
  describe_concept: 'Reading a variable', concept_values: 'Looking up values',
  edit_cohort: 'Building filters', event_rule_options: 'Checking date rules',
  count_cohort: 'Counting patients', run_table: 'Pulling rows', export_table: 'Exporting',
  crosstab: 'Cross-tabulating', breakdown: 'Breaking down', saved_reports: 'Reading reports',
  run_saved_report: 'Running a report', open_in_ui: 'Saving to Chiron',
  update_report: 'Updating the report', delete_report: 'Deleting the report',
  results: 'Reading your results', update_results: 'Updating your results',
  column_options: 'Checking column options', retrying: 'Claude is busy, retrying',
};
const SEND_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>';
const MAX_CHATS = 50, MAX_TURNS = 40;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function uid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// --- scrolling ---------------------------------------------------------------------
function atBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; }
function scrollDown(smooth) {
  scroller.style.scrollBehavior = smooth ? 'smooth' : 'auto';
  scroller.scrollTop = scroller.scrollHeight;
}
// Charts draw after the text is in place, which makes the page taller than when the
// first scroll ran; scroll again once they have.
function settle() { scrollDown(false); requestAnimationFrame(() => scrollDown(false)); setTimeout(() => scrollDown(false), 350); }
scroller.addEventListener('scroll', () => { $('to-bottom').hidden = atBottom(); });
$('to-bottom').onclick = () => scrollDown(true);

// --- conversations, kept in this browser ---------------------------------------------
// Following a link into Chiron navigates the whole UI and reloads this iframe, so the
// conversations have to outlive the page. They are kept per Chiron user and dataset, so
// two people sharing a browser never see each other's questions.
let ME = null, DATASET_NAME = DATASET, DATASET_LEVEL = '', POOL = [], FEATURES = {}, STARTERS = [];
let chats = [];          // newest first
let activeId = null;     // null = a new, empty chat
let busy = null;         // { chatId, turnId } while an answer streams

const storeKey = () => `chiron-ask:v2:${ME || 'anon'}:${DATASET}`;
// Conversations colleagues shared with this person, read-only; never saved in this
// browser (the server lists them), so they are kept apart from `chats`.
let SHARED = [];
let SHARE_RULE = 'at_least';   // who may read a shared answer: at least the sharer's access, or identical
const activeChat = () => chats.find(c => c.id === activeId) || SHARED.find(c => c.id === activeId) || null;
const canWrite = c => !!c && !c.view && !c.expired && (!c.readonly || c.write);

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    chats = (d && Array.isArray(d.chats)) ? d.chats : [];
    activeId = d && d.active;
  } catch (_) { chats = []; activeId = null; }
  migrateV1();
  // An answer that was still streaming when the page went away is gone.
  chats.forEach(c => c.turns.forEach(t => {
    if (t.pending) { t.pending = false; t.error = t.error || 'This answer was interrupted by leaving the page. Ask again.'; }
  }));
  if (!activeChat()) activeId = null;
}

// Conversations this tab deleted: a merge must not bring them back from another tab's copy.
const DELETED = new Set();
// Another Ask tab (or the Chiron page in a second window) may have saved since this one
// loaded. Before writing, take in what it holds: its conversations this tab lacks, and
// its newer copy of any held by both, so no tab's save drops another tab's chat.
function mergeStored(mine) {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(storeKey()) || 'null'); } catch (_) { stored = null; }
  const theirs = (stored && Array.isArray(stored.chats)) ? stored.chats : [];
  if (!theirs.length) return mine;
  const byId = new Map(mine.map(c => [c.id, c]));
  const byThread = new Map(mine.filter(c => c.thread).map(c => [c.thread, c]));
  theirs.forEach(t => {
    if (!t || !t.id || DELETED.has(t.id)) return;
    const m = byId.get(t.id) || (t.thread && byThread.get(t.thread));
    if (!m) mine.push(t);
    else if ((t.updated || 0) > (m.updated || 0) && !(busy && busy.chatId === m.id)) Object.assign(m, t);
  });
  return mine;
}
window.addEventListener('storage', e => {
  if (e.key !== storeKey() || busy) return;
  chats = mergeStored(chats);
  chats.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  renderSidebar();
});

function save() {
  chats = mergeStored(chats);
  chats.sort((a, b) => b.updated - a.updated);
  let keep = chats.slice(0, MAX_CHATS);
  chats.slice(MAX_CHATS).forEach(forgetOnServer);
  chats = keep;
  // localStorage is small; when it fills up, drop the oldest conversations first.
  for (;;) {
    try { localStorage.setItem(storeKey(), JSON.stringify({ chats: keep, active: activeId })); return; }
    catch (_) {
      if (!keep.length) return;
      forgetOnServer(keep[keep.length - 1]);
      keep = keep.slice(0, -1);
      chats = keep;
    }
  }
}

// The single conversation the page used to keep becomes the first entry in the list.
function migrateV1() {
  const oldKey = 'chiron-ask:' + DATASET;
  let old = null, oldThread = null;
  try { old = JSON.parse(localStorage.getItem(oldKey) || 'null'); oldThread = localStorage.getItem(oldKey + ':thread'); } catch (_) {}
  if (Array.isArray(old) && old.length) {
    const now = Date.now();
    chats.unshift({
      id: uid(), title: titleFor(old[0].q), created: now, updated: now, thread: oldThread,
      turns: old.map(t => Object.assign({ id: uid(), steps: [] }, t)),
    });
  }
  try { localStorage.removeItem(oldKey); localStorage.removeItem(oldKey + ':thread'); } catch (_) {}
}

function titleFor(q) {
  const t = (q || '').replace(/\s+/g, ' ').trim();
  return t.length > 64 ? t.slice(0, 61).trimEnd() + '…' : (t || 'New chat');
}

// Six starter questions for a new chat, each showing a different Ask feature. The
// features shown least recently come first and questions seen lately are skipped, so
// every new chat offers something new and a few chats walk through all of Ask.
function pickStarters() {
  const seenKey = storeKey() + ':seen';
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem(seenKey) || '[]'); } catch (_) {}
  const recent = new Set(seen), lastShown = {}, byFeature = {};
  POOL.forEach(p => (byFeature[p.feature] = byFeature[p.feature] || []).push(p));
  seen.forEach((q, i) => { const p = POOL.find(x => x.q === q); if (p) lastShown[p.feature] = i; });
  const features = Object.keys(byFeature)
    .map(f => [f, Math.random()]).sort((a, b) => a[1] - b[1]).map(x => x[0])   // shuffle
    .sort((a, b) => (lastShown[a] ?? -1) - (lastShown[b] ?? -1));            // oldest first
  STARTERS = features.slice(0, 6).map(f => {
    const fresh = byFeature[f].filter(p => !recent.has(p.q));
    const from = fresh.length ? fresh : byFeature[f];
    return from[Math.floor(Math.random() * from.length)];
  });
  try { localStorage.setItem(seenKey, JSON.stringify(seen.concat(STARTERS.map(p => p.q)).slice(-90))); } catch (_) {}
}

// Deleting a conversation also deletes its transcript on the server now, rather than
// when it would expire.
function forgetOnServer(chat) {
  if (!chat || !chat.thread) return;
  fetch('forget', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ thread: chat.thread }),
  }).catch(() => {});
}

// --- sidebar -------------------------------------------------------------------------
function groupOf(ts) {
  const d = new Date(ts), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return 'Previous 7 days';
  return 'Older';
}
function when(ts) {
  const d = new Date(ts), g = groupOf(ts);
  if (g === 'Today') return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (g === 'Yesterday') return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

let confirming = null;   // chat id showing "Delete?"
function renderSidebar() {
  chatsEl.textContent = '';
  const term = searchBox.value.trim().toLowerCase();
  const shown = chats.filter(c => !term || c.title.toLowerCase().includes(term) ||
    c.turns.some(t => (t.q || '').toLowerCase().includes(term)));
  if (!shown.length) {
    chatsEl.appendChild(el('div', 'no-chats', term
      ? 'No conversations match.'
      : 'Your conversations will appear here. Each one remembers its own follow-ups.'));
  }
  let lastGroup = null;
  shown.forEach(c => {
    const g = groupOf(c.updated);
    if (g !== lastGroup) { chatsEl.appendChild(el('div', 'group-label', g)); lastGroup = g; }
    const item = el('div', 'chat-item' + (c.id === activeId ? ' active' : '') + (c.expired ? ' expired' : ''));
    if (confirming === c.id) {
      const box = el('div', 'confirm');
      box.appendChild(el('span', null, 'Delete this chat?'));
      const yes = el('button', 'yes', 'Delete'); yes.type = 'button';
      const no = el('button', null, 'Cancel'); no.type = 'button';
      yes.onclick = () => deleteChat(c.id);
      no.onclick = () => { confirming = null; renderSidebar(); };
      box.append(yes, no);
      item.appendChild(box);
    } else {
      const open = el('button', 'open'); open.type = 'button';
      open.appendChild(el('span', 'title', c.title));
      const n = c.turns.length || c.count || 0;
      open.appendChild(el('span', 'meta', c.expired
        ? `${when(c.updated)} · expired: a follow-up starts a new conversation`
        : `${when(c.updated)} · ${n} question${n === 1 ? '' : 's'}`));
      open.onclick = () => selectChat(c.id);
      if (c.id === activeId) open.setAttribute('aria-current', 'true');
      item.appendChild(open);
      if (busy && busy.chatId === c.id) {
        item.appendChild(el('span', 'live'));
      } else {
        const del = el('button', 'del'); del.type = 'button';
        del.setAttribute('aria-label', 'Delete chat');
        del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
        del.onclick = e => { e.stopPropagation(); confirming = c.id; renderSidebar(); };
        item.appendChild(del);
      }
    }
    chatsEl.appendChild(item);
  });
  const sharedShown = SHARED.filter(c => !c.view && (!term || (c.title || '').toLowerCase().includes(term)));
  if (sharedShown.length) {
    chatsEl.appendChild(el('div', 'group-label', 'Shared with me'));
    sharedShown.forEach(c => {
      const item = el('div', 'chat-item' + (c.id === activeId ? ' active' : ''));
      const open = el('button', 'open'); open.type = 'button';
      open.appendChild(el('span', 'title', c.title));
      const meta = el('span', 'meta');
      meta.appendChild(el('span', 'by', 'by ' + (c.ownerName || c.owner || 'a colleague')));
      meta.appendChild(document.createTextNode(' · ' + when(c.updated) + (c.write ? ' · you can continue' : ' · read-only')));
      open.appendChild(meta);
      open.onclick = () => selectChat(c.id);
      if (c.id === activeId) open.setAttribute('aria-current', 'true');
      item.appendChild(open);
      chatsEl.appendChild(item);
    });
  }
}
searchBox.addEventListener('input', renderSidebar);

function selectChat(id) {
  confirming = null;
  activeId = id;
  save();
  closeSidebar();
  renderSidebar();
  renderThread();
  updateComposer();
  qBox.focus();
  const c = activeChat();
  if (c && c.thread && c.turns.length) refreshTurns(c);
}
// Share and Export PDF: for the open conversation once the server knows it. Sharing
// is the owner's; a shared conversation can be exported but not shared on.
function renderTopTools() {
  const chat = activeChat();
  const view = document.body.classList.contains('view-mode');
  // Not for a conversation the server no longer holds (expired): nothing to share or print.
  const show = !!(chat && chat.thread && !chat.expired && !busy && !view);
  // Questions stays, on a new chat too, whenever the server has the library.
  const lib = !!(LIB && ME && DATASET && !view);
  $('top-tools').hidden = !(show || lib);
  $('lib-btn').hidden = !lib;
  $('export-btn').hidden = !show;
  $('share-btn').hidden = !show || !!chat.readonly;
  $('clone-btn').hidden = !show || !chat.readonly;
  if (!show) { closeShare(); return; }
  const n = (chat.sharedWith || []).length;
  $('share-btn').lastChild.textContent = n ? ` Shared · ${n}` : ' Share';
}
// Clone: a copy of a colleague's conversation becomes one of mine, with the answers I
// could see in it as context; my questions in it are answered at my own access level.
$('clone-btn').onclick = async () => {
  const chat = activeChat(); if (!chat || !chat.thread) return;
  $('clone-btn').disabled = true;
  let r = null;
  try {
    r = await fetch('clone', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify({ thread: chat.thread }) }).then(x => x.json());
  } catch (_) { r = { error: 'The Ask server could not be reached.' }; }
  $('clone-btn').disabled = false;
  if (!r || r.error || !r.thread) {
    threadEl.appendChild(el('div', 'err', (r && r.error) || 'The conversation could not be copied.'));
    return;
  }
  const now = Date.now();
  const copy = { id: uid(), title: titleFor(r.title || ('Copy of ' + chat.title)), created: now, updated: now,
                 thread: r.thread, turns: [], count: r.turns || 0, remote: true, clonedFrom: chat.thread, sharedWith: [] };
  chats.unshift(copy);
  selectChat(copy.id);
};
let SHARE_OPEN = false;
function closeShare() {
  SHARE_OPEN = false;
  $('share-pop').hidden = true;
  $('share-btn').setAttribute('aria-expanded', 'false');
}

async function syncThreads() {

  catch (_) { return; }

    if (!c.thread) return;
    const t = known.get(c.thread);
    const expired = t ? !!t.expired : true;
    if (!!c.expired !== expired) { c.expired = expired; changed = true; }
    if (t && t.last && t.last * 1000 > (c.updated || 0) + 1000) { c.updated = t.last * 1000; changed = true; }
    if (t && t.turns && !c.turns.length && c.count !== t.turns) { c.count = t.turns; changed = true; }
    if (t && t.title && c.remote && !c.turns.length && c.title !== titleFor(t.title)) { c.title = titleFor(t.title); changed = true; }

    const prev = SHARED.find(c => c.thread === t.thread && !c.view);
    keep.push(Object.assign(prev || { id: 'shared:' + t.thread, turns: [], readonly: true, thread: t.thread }, {
      title: titleFor(t.title || 'Conversation'), updated: (t.last || 0) * 1000, created: (t.first || t.last || 0) * 1000,
      owner: t.owner, ownerName: t.owner_name, count: t.turns || 0, expired: !!t.expired,
